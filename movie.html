<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#080808">

<title>NEX BOX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080808;
color:#fff;
font-family:Arial,sans-serif;
}

header{
padding:18px 20px;
background:#111;
border-bottom:1px solid #292929;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:2px;
}

.logo span{
color:#e50914;
}

.container{
max-width:1100px;
margin:auto;
padding:25px 20px 60px;
}

.back{
display:inline-block;
background:#222;
color:#fff;
text-decoration:none;
padding:11px 18px;
border-radius:6px;
margin-bottom:25px;
}

.movie-layout{
display:flex;
gap:30px;
}

.poster{
width:240px;
height:350px;
object-fit:cover;
border-radius:10px;
background:#151515;
}

.info{
flex:1;
}

h1{
font-size:38px;
margin-top:0;
}

.meta{
color:#999;
margin-bottom:20px;
}

.description{
color:#bbb;
line-height:1.7;
}

.watch{
display:inline-block;
margin-top:15px;
background:#e50914;
color:#fff;
padding:14px 24px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
}

.player{
margin-top:35px;
}

video{
width:100%;
max-height:650px;
background:#000;
border-radius:10px;
}

.error{
color:#aaa;
padding:40px 0;
}

@media(max-width:700px){

.movie-layout{
flex-direction:column;
}

.poster{
width:190px;
height:280px;
}

h1{
font-size:29px;
}

}

</style>

</head>


<body>


<header>

<div class="logo">
NEX<span>BOX</span>
</div>

</header>


<div class="container">

<a
href="./index.html"
class="back">

← Back

</a>


<div id="content">

<div class="error">
Loading movie...
</div>

</div>

</div>


<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


const params =
new URLSearchParams(
window.location.search
);

const movieId =
params.get("id");


async function loadMovie(){

if(!movieId){

showError("Movie not found.");

return;

}


const {data,error} =
await supabaseClient
.from("movies")
.select("*")
.eq("id",movieId)
.single();


if(error || !data){

console.error(error);

showError("Movie not found.");

return;

}


document.title =
data.title+" - NEX BOX";


document.getElementById("content")
.innerHTML=`

<div class="movie-layout">

<img
class="poster"
src="${data.poster_url || ''}"
alt="${escapeHtml(data.title)}">

<div class="info">

<h1>
${escapeHtml(data.title)}
</h1>

<div class="meta">
${data.year || ""}
•
${escapeHtml(data.genre || "")}
</div>

<p class="description">
${escapeHtml(
data.description ||
"No description available."
)}
</p>

<a
href="#player"
class="watch">

▶ Watch Full Movie

</a>

</div>

</div>


<div
class="player"
id="player">

<video
controls
playsinline
preload="metadata">

<source
src="${data.video_url || ''}"
type="video/mp4">

Your browser does not support video playback.

</video>

</div>

`;

}


function showError(message){

document.getElementById("content")
.innerHTML=
"<div class='error'>"+message+"</div>";

}


function escapeHtml(text){

const div =
document.createElement("div");

div.textContent=text || "";

return div.innerHTML;

}


loadMovie();

</script>


</body>

</html>
