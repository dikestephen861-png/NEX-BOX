<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEX BOX Movies</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#050505;
 color:#fff;
 font-family:Arial,sans-serif;
 padding-bottom:80px
}
header{
 height:60px;
 display:flex;
 align-items:center;
 padding:0 15px;
 background:#090909;
 border-bottom:1px solid #222;
 position:sticky;
 top:0;
 z-index:10
}
.logo{font-size:22px;font-weight:900}
.logo span{color:#e50914}
.search{
 margin:14px;
 display:flex;
 background:#151515;
 border:1px solid #252525;
 border-radius:10px;
 overflow:hidden
}
.search input{
 flex:1;
 background:none;
 border:0;
 outline:0;
 color:white;
 padding:13px;
 font-size:14px
}
.search button{
 border:0;
 background:#e50914;
 color:white;
 padding:0 16px
}
.grid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
 padding:0 12px
}
.card{
 background:#111;
 border-radius:10px;
 overflow:hidden;
 border:1px solid #202020;
 cursor:pointer
}
.poster{
 width:100%;
 aspect-ratio:2/3;
 object-fit:cover;
 background:#181818;
 display:block
}
.no-poster{
 width:100%;
 aspect-ratio:2/3;
 background:linear-gradient(145deg,#191919,#080808);
 display:flex;
 align-items:center;
 justify-content:center;
 color:#e50914;
 font-size:28px;
 font-weight:900
}
.card-info{padding:10px}
.card-title{
 font-size:14px;
 font-weight:700;
 white-space:nowrap;
 overflow:hidden;
 text-overflow:ellipsis
}
.card-meta{
 color:#888;
 font-size:11px;
 margin-top:5px
}
.message{
 text-align:center;
 padding:50px 20px;
 color:#888
}
.spinner{
 width:34px;
 height:34px;
 border:4px solid #333;
 border-top-color:#e50914;
 border-radius:50%;
 animation:spin .8s linear infinite;
 margin:auto auto 15px
}
@keyframes spin{to{transform:rotate(360deg)}}
.bottom{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:65px;
 background:#090909;
 border-top:1px solid #222;
 display:flex;
 z-index:20
}
.bottom a{
 flex:1;
 color:#777;
 text-decoration:none;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 font-size:11px;
 gap:4px
}
.bottom a.active{color:#fff}
.bottom .icon{font-size:20px}
</style>
</head>

<body>

<header>
 <div class="logo">NEX <span>BOX</span></div>
</header>

<div class="search">
 <input id="searchInput" placeholder="Search movies...">
 <button onclick="searchMovies()">Search</button>
</div>

<div id="movieGrid" class="grid">
 <div class="message" style="grid-column:1/-1">
  <div class="spinner"></div>
  Loading movies...
 </div>
</div>

<nav class="bottom">
 <a href="index.html?v=31">
  <div class="icon">⌂</div>
  Home
 </a>
 <a href="movies.html?v=31" class="active">
  <div class="icon">🎬</div>
  Movies
 </a>
 <a href="library.html?v=31">
  <div class="icon">♡</div>
  My List
 </a>
</nav>

<script>
const SUPABASE_URL =
 "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
 window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );

let allMovies=[];

async function loadMovies(){

 const grid=document.getElementById("movieGrid");

 try{

  const {data,error}=await db
   .from("movies")
   .select("*")
   .order("created_at",{ascending:false});

  if(error) throw error;

  allMovies=data || [];

  renderMovies(allMovies);

 }catch(error){

  console.error("NEX BOX movies error:",error);

  grid.innerHTML=`
   <div class="message" style="grid-column:1/-1">
    <h3>Movies could not be loaded</h3>
    <p>Database connection error.</p>
    <button onclick="loadMovies()" style="
     background:#e50914;
     border:0;
     color:white;
     padding:12px 20px;
     border-radius:8px;
     font-weight:bold">
     Try Again
    </button>
   </div>
  `;
 }
}

function renderMovies(movies){

 const grid=document.getElementById("movieGrid");

 if(!movies.length){

  grid.innerHTML=`
   <div class="message" style="grid-column:1/-1">
    No movies found.
   </div>
  `;

  return;
 }

 grid.innerHTML=movies.map(movie=>{

  const poster=movie.poster_url;

  const posterHTML=poster
   ? `<img class="poster"
       src="${escapeAttr(poster)}"
       onerror="this.outerHTML='<div class=&quot;no-poster&quot;>NEX</div>'">`
   : `<div class="no-poster">NEX</div>`;

  return `
   <article class="card"
    onclick='openMovie(${JSON.stringify(movie).replace(/'/g,"&#39;")})'>

    ${posterHTML}

    <div class="card-info">
     <div class="card-title">
      ${escapeHTML(movie.title || "Untitled")}
     </div>

     <div class="card-meta">
      ${escapeHTML(movie.year || "Movie")}
      ${movie.genre ? " • "+escapeHTML(movie.genre) : ""}
     </div>
    </div>

   </article>
  `;

 }).join("");
}

function openMovie(movie){

 const encoded=
  encodeURIComponent(
   JSON.stringify(movie)
  );

 window.location.href=
  "watch.html?movie="+encoded;
}

function searchMovies(){

 const term=
  document.getElementById("searchInput")
   .value
   .trim()
   .toLowerCase();

 if(!term){

  renderMovies(allMovies);
  return;
 }

 renderMovies(
  allMovies.filter(movie=>
   String(movie.title||"")
    .toLowerCase()
    .includes(term) ||

   String(movie.genre||"")
    .toLowerCase()
    .includes(term) ||

   String(movie.year||"")
    .includes(term)
  )
 );
}

document.getElementById("searchInput")
 .addEventListener("input",searchMovies);

function escapeHTML(value){

 return String(value)
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

function escapeAttr(value){
 return escapeHTML(value);
}

loadMovies();
</script>

</body>
</html>
