<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEX BOX Admin</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    width:92%;
    max-width:420px;
    margin:60px auto;
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    letter-spacing:3px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin-bottom:30px;
}

.card{
    background:#111;
    border:1px solid #333;
    border-radius:16px;
    padding:22px;
}

label{
    display:block;
    color:#ccc;
    font-size:14px;
    margin:16px 0 7px;
}

input{
    display:block;
    width:100%;
    height:50px;
    padding:0 14px;
    background:#1b1b1b;
    color:#fff;
    border:1px solid #444;
    border-radius:8px;
    font-size:15px;
}

input:focus{
    outline:none;
    border-color:#fff;
}

button{
    display:block;
    width:100%;
    height:52px;
    margin-top:20px;
    background:#fff;
    color:#000;
    border:0;
    border-radius:8px;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

button:active{
    transform:scale(.98);
}

button:disabled{
    opacity:.6;
}

.message{
    margin-top:18px;
    padding:12px;
    border-radius:8px;
    text-align:center;
    background:#1a1a1a;
    color:#aaa;
    font-size:14px;
    min-height:20px;
}

.success{
    color:#65ff8a;
}

.error{
    color:#ff6666;
}

#dashboard{
    display:none;
}

.admin-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:8px;
}

.admin-email{
    color:#888;
    font-size:13px;
}

.logout{
    background:#222;
    color:#fff;
    border:1px solid #444;
}

.movie-form{
    margin-top:25px;
}

textarea{
    width:100%;
    min-height:100px;
    padding:12px;
    background:#1b1b1b;
    color:#fff;
    border:1px solid #444;
    border-radius:8px;
    resize:vertical;
    font-family:Arial,sans-serif;
}

.file{
    padding-top:10px;
    height:auto;
}

.movie-list{
    margin-top:25px;
}

.movie-item{
    border-top:1px solid #333;
    padding:15px 0;
}

.movie-item strong{
    display:block;
    margin-bottom:5px;
}

.movie-item span{
    color:#888;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">NEX BOX</div>

    <div class="subtitle">
        Admin Control Panel
    </div>


    <!-- LOGIN -->

    <div id="loginBox" class="card">

        <h2>Admin Login</h2>

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            value="dikestephen861@gmail.com"
            autocomplete="username"
        >


        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >


        <button
            id="loginButton"
            type="button"
        >
            LOGIN
        </button>


        <div
            id="loginMessage"
            class="message"
        >
            Ready
        </div>

    </div>


    <!-- DASHBOARD -->

    <div id="dashboard">

        <div class="card">

            <div class="admin-title">
                NEX BOX Admin
            </div>

            <div
                id="adminEmail"
                class="admin-email"
            ></div>


            <button
                id="logoutButton"
                class="logout"
                type="button"
            >
                LOGOUT
            </button>

        </div>


        <div class="card movie-form">

            <h2>Add Movie</h2>

            <label>
                Movie Title
            </label>

            <input
                id="movieTitle"
                type="text"
                placeholder="Movie title"
            >


            <label>
                Description
            </label>

            <textarea
                id="movieDescription"
                placeholder="Movie description"
            ></textarea>


            <label>
                Genre
            </label>

            <input
                id="movieGenre"
                type="text"
                placeholder="Action, Drama, Comedy..."
            >


            <label>
                Year
            </label>

            <input
                id="movieYear"
                type="number"
                placeholder="2026"
            >


            <label>
                Poster
            </label>

            <input
                id="posterFile"
                class="file"
                type="file"
                accept="image/*"
            >


            <label>
                Movie MP4
            </label>

            <input
                id="videoFile"
                class="file"
                type="file"
                accept="video/mp4,video/*"
            >


            <button
                id="uploadButton"
                type="button"
            >
                UPLOAD MOVIE
            </button>


            <div
                id="uploadMessage"
                class="message"
            >
                Ready to upload
            </div>

        </div>


        <div class="card movie-list">

            <h2>Movies</h2>

            <div id="movies">
                Loading...
            </div>

        </div>

    </div>

</div>
