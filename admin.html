<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#080808">

  <title>NEX BOX ADMIN</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at top,
          #292929 0%,
          #0b0b0b 45%,
          #000 100%
        );
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: #111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 25px 70px rgba(0, 0, 0, .6);
    }

    .logo {
      text-align: center;
      font-size: 35px;
      font-weight: 900;
      letter-spacing: 3px;
    }

    .admin-label {
      text-align: center;
      color: #999;
      margin-top: 6px;
      margin-bottom: 28px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #333;
      border-radius: 11px;
      background: #1a1a1a;
      color: #fff;
      outline: none;
      padding: 14px;
    }

    input::placeholder,
    textarea::placeholder {
      color: #666;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #777;
    }

    .primary-btn {
      width: 100%;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-weight: 800;
      padding: 15px;
    }

    .primary-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message.error {
      display: block;
      background: #351111;
      color: #ffaaaa;
      border: 1px solid #682323;
    }

    .message.success {
      display: block;
      background: #102d1a;
      color: #9cffb5;
      border: 1px solid #205e35;
    }

    .small-note {
      margin-top: 15px;
      text-align: center;
      color: #666;
      font-size: 11px;
      line-height: 1.5;
    }

    /* =========================
       ADMIN
    ========================= */

    #adminScreen {
      min-height: 100vh;
      background: #080808;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 15px;
      background: rgba(8, 8, 8, .96);
      border-bottom: 1px solid #242424;
      backdrop-filter: blur(15px);
    }

    .top-title {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .logout-btn {
      background: #202020;
      border: 1px solid #383838;
      color: #fff;
      border-radius: 9px;
      padding: 9px 13px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 15px 60px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 6px;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      color: #888;
      font-size: 14px;
    }

    .card {
      background: #111;
      border: 1px solid #242424;
      border-radius: 17px;
      padding: 18px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .file-box {
      border: 1px dashed #444;
      border-radius: 12px;
      padding: 15px;
      background: #151515;
    }

    .file-box label {
      display: block;
      color: #aaa;
      font-size: 13px;
      margin-bottom: 9px;
    }

    input[type="file"] {
      padding: 10px;
    }

    .upload-status {
      margin-top: 8px;
      color: #888;
      font-size: 12px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .progress {
      display: none;
      width: 100%;
      height: 6px;
      margin-top: 10px;
      background: #242424;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #fff;
      transition: width .2s;
    }

    .publish-btn {
      margin-top: 3px;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 25px;
    }

    .movie-item {
      display: flex;
      gap: 13px;
      padding: 13px 0;
      border-bottom: 1px solid #252525;
    }

    .movie-item:last-child {
      border-bottom: 0;
    }

    .movie-poster {
      width: 70px;
      height: 95px;
      flex-shrink: 0;
      object-fit: cover;
      border-radius: 8px;
      background: #222;
    }

    .movie-info {
      flex: 1;
      min-width: 0;
    }

    .movie-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
      overflow-wrap: anywhere;
    }

    .movie-meta {
      color: #999;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .movie-url {
      color: #666;
      font-size: 10px;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .card {
        padding: 15px;
      }

      .welcome h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN SCREEN
  ========================= -->

  <section id="loginScreen">

    <div class="login-box">

      <div class="logo">
        NEX BOX
      </div>

      <div class="admin-label">
        Administrator Login
      </div>

      <form id="loginForm">

        <div class="field">

          <label for="email">
            Admin Email
          </label>

          <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Enter admin email"
            required
          >

        </div>

        <div class="field">

          <label for="password">
            Password
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Enter your Supabase password"
            required
          >

        </div>

        <button
          id="loginButton"
          class="primary-btn"
          type="submit"
        >
          LOGIN
        </button>

        <div
          id="loginMessage"
          class="message"
        ></div>

        <div class="small-note">
          Use the email and password belonging to your
          NEX BOX Supabase administrator account.
        </div>

      </form>

    </div>

  </section>


  <!-- =========================
       ADMIN SCREEN
  ========================= -->

  <section
    id="adminScreen"
    class="hidden"
  >

    <header class="topbar">

      <div class="top-title">
        NEX BOX ADMIN
      </div>

      <button
        id="logoutButton"
        class="logout-btn"
        type="button"
      >
        Logout
      </button>

    </header>


    <main class="container">

      <div class="welcome">

        <h1>
          Movie Manager
        </h1>

        <p>
          Add authorized movies to your NEX BOX library.
        </p>

      </div>


      <!-- ADD MOVIE -->

      <div class="card">

        <h2>
          Add New Movie
        </h2>

        <form id="movieForm">

          <div class="grid">

            <div class="field">

              <label for="movieTitle">
                Movie Title
              </label>

              <input
                id="movieTitle"
                type="text"
                placeholder="Enter movie title"
                required
              >

            </div>


            <div class="field">

              <label for="movieYear">
                Release Year
              </label>

              <input
                id="movieYear"
                type="number"
                min="1900"
                max="2100"
                placeholder="2026"
              >

            </div>


            <div class="field">

              <label for="movieGenre">
                Genre
              </label>

              <input
                id="movieGenre"
                type="text"
                placeholder="Action, Drama, Comedy..."
              >

            </div>


            <div class="field">

              <label for="downloadable">
                Download Available
              </label>

              <select id="downloadable">

                <option value="true">
                  Yes
                </option>

                <option value="false">
                  No
                </option>

              </select>

            </div>


            <div class="field full">

              <label for="movieDescription">
                Description
              </label>

              <textarea
                id="movieDescription"
                placeholder="Write a short movie description..."
              ></textarea>

            </div>


            <div class="file-box">

              <label for="posterFile">
                Movie Poster
              </label>

              <input
                id="posterFile"
                type="file"
                accept="image/*"
                required
              >

              <div
                id="posterStatus"
                class="upload-status"
              >
                No poster selected.
              </div>

            </div>


            <div class="file-box">

              <label for="videoFile">
                Movie Video
              </label>

              <input
                id="videoFile"
                type="file"
                accept="video/mp4,video/webm,video/*"
                required
              >

              <div
                id="videoStatus"
                class="upload-status"
              >
                No video selected.
              </div>

            </div>


            <div class="full">

              <button
                id="publishButton"
                class="primary-btn"
                type="submit"
              >
                PUBLISH MOVIE
              </button>

            </div>

          </div>

          <div
            id="movieMessage"
            class="message"
          ></div>

        </form>

      </div>


      <!-- MOVIES -->

      <div class="card">

        <h2>
          Published Movies
        </h2>

        <div id="movieList">

          <div class="loading">
            Loading movies...
          </div>

        </div>

      </div>

    </main>

  </section>


  <script>

    /* =====================================================
       SUPABASE
    ===================================================== */

    const SUPABASE_URL =
      "https://jacxlmcwwedertcaizdj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const adminScreen =
      document.getElementById("adminScreen");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutButton =
      document.getElementById("logoutButton");

    const movieForm =
      document.getElementById("movieForm");

    const publishButton =
      document.getElementById("publishButton");

    const movieMessage =
      document.getElementById("movieMessage");

    const movieList =
      document.getElementById("movieList");

    const posterFile =
      document.getElementById("posterFile");

    const videoFile =
      document.getElementById("videoFile");

    const posterStatus =
      document.getElementById("posterStatus");

    const videoStatus =
      document.getElementById("videoStatus");


    /* =====================================================
       MESSAGE
    ===================================================== */

    function showMessage(
      element,
      message,
      type
    ) {

      element.textContent =
        message;

      element.className =
        "message " + type;

    }


    function clearMessage(element) {

      element.textContent = "";

      element.className =
        "message";

    }


    /* =====================================================
       FILE INFORMATION
    ===================================================== */

    posterFile.addEventListener(
      "change",
      function () {

        const file =
          posterFile.files[0];

        if (!file) {

          posterStatus.textContent =
            "No poster selected.";

          return;

        }

        posterStatus.textContent =
          file.name +
          " — " +
          formatBytes(file.size);

      }
    );


    videoFile.addEventListener(
      "change",
      function () {

        const file =
          videoFile.files[0];

        if (!file) {

          videoStatus.textContent =
            "No video selected.";

          return;

        }

        videoStatus.textContent =
          file.name +
          " — " +
          formatBytes(file.size);

      }
    );


    function formatBytes(bytes) {

      if (!bytes) {
        return "0 Bytes";
      }

      const sizes = [
        "Bytes",
        "KB",
        "MB",
        "GB"
      ];

      const i =
        Math.floor(
          Math.log(bytes) /
          Math.log(1024)
        );

      return (
        Math.round(
          bytes /
          Math.pow(1024, i) *
          100
        ) / 100
      ) +
      " " +
      sizes[i];

    }


    /* =====================================================
       LOGIN
    ===================================================== */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        clearMessage(loginMessage);

        loginButton.disabled = true;

        loginButton.textContent =
          "CHECKING...";


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            loginMessage,
            "Enter your email and password.",
            "error"
          );

          loginButton.disabled = false;

          loginButton.textContent =
            "LOGIN";

          return;

        }


        try {

          console.log(
            "NEX BOX: starting login..."
          );


          /* SUPABASE AUTH */

          const {
            data,
            error
          } =
            await supabaseClient.auth
              .signInWithPassword({
                email: email,
                password: password
              });


          console.log(
            "Supabase response:",
            data,
            error
          );


          if (error) {

            throw new Error(
              error.message ||
              "Supabase sign-in failed."
            );

          }


          if (
            !data ||
            !data.user
          ) {

            throw new Error(
              "Login did not return a user session."
            );

          }


          console.log(
            "Authenticated:",
            data.user.id
          );


          /* ADMIN CHECK */

          const {
            data: admin,
            error: adminError
          } =
            await supabaseClient
              .from("admin_users")
              .select(
                "user_id,email"
              )
              .eq(
                "user_id",
                data.user.id
              )
              .maybeSingle();


          console.log(
            "Admin check:",
            admin,
            adminError
          );


          if (adminError) {

            throw new Error(
              "Login succeeded, but NEX BOX could not verify administrator access: " +
              adminError.message
            );

          }


          if (!admin) {

            await supabaseClient
              .auth
              .signOut();

            throw new Error(
              "This account is not registered as a NEX BOX administrator."
            );

          }


          /* OPEN DASHBOARD */

          loginScreen.classList.add(
            "hidden"
          );

          adminScreen.classList.remove(
            "hidden"
          );


          await loadMovies();


        } catch (error) {

          console.error(
            "NEX BOX LOGIN ERROR:",
            error
          );


          showMessage(
            loginMessage,
            error.message ||
            "Login failed.",
            "error"
          );


        } finally {

          loginButton.disabled =
            false;

          loginButton.textContent =
            "LOGIN";

        }

      }
    );


    /* =====================================================
       SESSION
    ===================================================== */

    async function checkSession() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          return;

        }


        if (!data.session) {

          return;

        }


        const {
          data: admin,
          error: adminError
        } =
          await supabaseClient
            .from("admin_users")
            .select(
              "user_id,email"
            )
            .eq(
              "user_id",
              data.session.user.id
            )
            .maybeSingle();


        if (
          adminError ||
          !admin
        ) {

          await supabaseClient
            .auth
            .signOut();

          return;

        }


        loginScreen.classList.add(
          "hidden"
        );

        adminScreen.classList.remove(
          "hidden"
        );


        await loadMovies();


      } catch (error) {

        console.error(
          "Session check error:",
          error
        );

      }

    }


    /* =====================================================
       LOGOUT
    ========================================
