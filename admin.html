<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEX BOX Admin</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#050505;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  padding:20px;
}

.box{
  max-width:500px;
  margin:30px auto;
  background:#111;
  border:1px solid #333;
  border-radius:16px;
  padding:25px;
}

h1{
  margin:0 0 10px;
}

p{
  color:#999;
  line-height:1.5;
}

input{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:10px;
  border:1px solid #333;
  background:#1b1b1b;
  color:white;
}

button{
  width:100%;
  padding:15px;
  margin-top:15px;
  border:0;
  border-radius:10px;
  background:#e50914;
  color:white;
  font-weight:bold;
  font-size:15px;
}

button:active{
  transform:scale(.98);
}

#test{
  margin-top:20px;
  padding:12px;
  background:#182018;
  border-radius:10px;
  color:#72e08c;
}
</style>
</head>

<body>

<div class="box">

<h1>NEX <span style="color:#e50914">BOX</span></h1>

<p>
Admin page is loading correctly.
</p>

<input
id="email"
type="email"
placeholder="Admin email">

<input
id="password"
type="password"
placeholder="Password">

<button onclick="testButton()">
TEST ADMIN
</button>

<div id="test">
Waiting for test...
</div>

</div>

<script>

function testButton(){

document.getElementById("test").innerHTML =
"✓ BUTTON IS WORKING";

}

</script>

</body>
</html>
