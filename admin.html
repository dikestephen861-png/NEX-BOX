<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEX BOX Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .hidden {
      display: none !important;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #080808;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 30px;
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin: 8px 0 28px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #ccc;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: #0b0b0b;
      border: 1px solid #333;
      color: white;
      border-radius: 10px;
      padding: 13px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: white;
    }

    .login-btn,
    .add-btn {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 15px;
      margin-top: 20px;
      background: white;
      color: black;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #252525;
      color: #ddd;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: #090909;
      border-bottom: 1px solid #292929;
    }

    .topbar-title {
      font-size: 20px;
      font-weight: 900;
    }

    .logout-btn {
      background: #222;
      border: 1px solid #444;
      color: white;
      border-radius: 9px;
      padding: 9px 14px;
      cursor: pointer;
    }
