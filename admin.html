<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">

  <title>NEX BOX Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: auto;
      padding: 25px 18px 50px;
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: 900;
      margin: 20px 0 8px;
      letter-spacing: 2px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 30px;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    input,
    textarea {
      width: 100%;
      padding: 14px;
      margin: 8px 0 12px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #090909;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      border-color: #fff;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #fff;
      color: #000;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 8px;
      min-height: 50px;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.98);
    }

    button:disabled {
      opacity: .5;
    }

    .secondary {
      background: #242424;
      color: white;
    }

    .danger {
      background: #b00020;
      color: white;
    }

    .hidden {
      display: none !important;
    }

    .status {
      padding: 13px;
      border-radius: 10px;
      background: #202020;
      color: #ddd;
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .movie {
      padding: 15px;
      border: 1px solid #292929;
      border-radius: 12px;
      margin-top: 12px;
      background: #101010;
    }

    .movie-title {
      font-weight: bold;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .small {
      color: #888;
      font-size: 13px;
    }

    .logout {
      margin-top: 25px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      color: #ccc;
    }

    .check input {
      width: 20px;
      height: 20px;
      margin: 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">NEX BOX</div>
  <div class="subtitle">Administrator Panel</div>

  <!-- LOGIN -->
  <div id="loginBox" class="card">

    <h2>Admin Sign In</h2>

    <form id="loginForm">

      <input
        id="email"
        type="email"
        placeholder="Email address"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button id="signInButton" type="submit">
        SIGN IN
      </button>

    </form>

    <div id="loginStatus" class="status hidden"></div>

  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" class="hidden">

    <div class="card">

      <h2>Add Movie</h2>

      <input id="title" type="text" placeholder="Movie title">

      <textarea
        id="description"
        placeholder="Movie description"
      ></textarea>

      <input
        id="genre"
        type="text"
        placeholder="Genre"
      >

      <input
        id="year"
        type="number"
        placeholder="Year"
      >

      <label class="small">Poster image</label>
      <input id="poster" type="file" accept="image/*">

      <label class="small">Movie video</label>
      <input id="video" type="file" accept="video/mp4,video/*">

      <label class="check">
        <input id="downloadable" type="checkbox">
        Allow download
      </label>

      <button id="uploadButton">
        ADD MOVIE
      </button>

      <div id="uploadStatus" class="status hidden"></div>

    </div>


    <div class="card">

      <h2>Your Movies</h2>

      <div id="movieList">
        Loading movies...
      </div>

    </div>

    <button id="logoutButton" class="secondary logout">
      LOG OUT
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

let supabaseClient;


/* --------------------------------
   START
-------------------------------- */

document.addEventListener("DOMContentLoaded", function () {

  console.log("NEX BOX Admin JavaScript loaded");

  if (!window.supabase) {
    showLoginStatus(
      "Supabase library failed to load. Check your internet connection and reload the page.",
      true
    );
    return;
  }

  supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  document
    .getElementById("loginForm")
    .addEventListener("submit", loginAdmin);

  document
    .getElementById("uploadButton")
    .addEventListener("click", submitMovie);

  document
    .getElementById("logoutButton")
    .addEventListener("click", logoutAdmin);

  checkExistingSession();

});


/* --------------------------------
   LOGIN
-------------------------------- */

async function loginAdmin(event) {

  event.preventDefault();

  console.log("SIGN IN BUTTON CLICKED");

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    showLoginStatus(
      "Enter your email and password.",
      true
    );
    return;
  }

  const button =
    document.getElementById("signInButton");

  button.disabled = true;
  button.textContent = "SIGNING IN...";

  showLoginStatus(
    "Connecting to NEX BOX..."
  );

  try {

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (result.error) {
      throw result.error;
    }

    showLoginStatus(
      "Login successful. Checking administrator access..."
    );

    await checkAdmin();

  } catch (error) {

    console.error("LOGIN ERROR:", error);

    showLoginStatus(
      error.message ||
      "Sign in failed.",
      true
    );

  } finally {

    button.disabled = false;
    button.textContent = "SIGN IN";

  }

}


/* --------------------------------
   CHECK SESSION
-------------------------------- */

async function checkExistingSession() {

  try {

    const {
      data
    } = await supabaseClient.auth.getSession();

    if (
      data &&
      data.session &&
      data.session.user
    ) {

      await checkAdmin();

    }

  } catch (error) {

    console.error(error);

  }

}


/* --------------------------------
   CHECK ADMIN
-------------------------------- */

async function checkAdmin() {

  try {

    const {
      data: {
        user
      }
    } =
      await supabaseClient.auth.getUser();

    if (!user) {

      showLoginStatus(
        "Please sign in.",
        true
      );

      return;

    }

    console.log(
      "Signed in user:",
      user.email
    );

    const {
      data,
      error
    } =
      await supabaseClient
        .from("admin_users")
        .select("user_id,email")
        .eq("user_id", user.id)
        .maybeSingle();

    if (error) {
      throw error;
    }

    if (!data) {

      showLoginStatus(
        "This account is not registered as a NEX BOX administrator.",
        true
      );

      await supabaseClient.auth.signOut();

      return;

    }

    document
      .getElementById("loginBox")
      .classList.add("hidden");

    document
      .getElementById("dashboard")
      .classList.remove("hidden");

    await loadMovies();

  } catch (error) {

    console.error(
      "ADMIN CHECK ERROR:",
      error
    );

    showLoginStatus(
      error.message ||
      "Could not verify administrator access.",
      true
    );

  }

}


/* --------------------------------
   ADD MOVIE
-------------------------------- */

async function submitMovie() {

  const title =
    document.getElementById("title").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const genre =
    document.getElementById("genre").value.trim();

  const yearValue =
    document.getElementById("year").value;

  const poster =
    document.getElementById("poster").files[0];

  const video =
    document.getElementById("video").files[0];

  const downloadable =
    document.getElementById("downloadable").checked;

  if (!title) {

    showUploadStatus(
      "Enter a movie title.",
      true
    );

    return;

  }

  if (!video) {

    showUploadStatus(
      "Select an MP4 movie file.",
      true
    );

    return;

  }

  const button =
    document.getElementById("uploadButton");

  button.disabled = true;
  button.textContent = "UPLOADING...";

  showUploadStatus(
    "Uploading movie..."
  );

  try {

    let posterUrl = "";

    if (poster) {

      const posterPath =
        Date.now() +
        "_" +
        cleanFileName(poster.name);

      const {
        error
      } =
        await supabaseClient
          .storage
          .from("Posters")
          .upload(
            posterPath,
            poster
          );

      if (error) {
        throw error;
      }

      const {
        data
      } =
        supabaseClient
          .storage
          .from("Posters")
          .getPublicUrl(
            posterPath
          );

      posterUrl =
        data.publicUrl;

    }


    showUploadStatus(
      "Uploading video..."
    );

    const videoPath =
      Date.now() +
      "_" +
      cleanFileName(video.name);

    const {
      error: videoError
    } =
      await supabaseClient
        .storage
        .from("Videos")
        .upload(
          videoPath,
          video
        );

    if (videoError) {
      throw videoError;
    }

    const {
      data: videoData
    } =
      supabaseClient
        .storage
        .from("Videos")
        .getPublicUrl(
          videoPath
        );

    const videoUrl =
      videoData.publicUrl;


    showUploadStatus(
      "Saving movie to database..."
    );

    const {
      error: databaseError
    } =
      await supabaseClient
        .from("movies")
        .insert({

          title: title,

          description:
            description || null,

          genre:
            genre || null,

          year:
            yearValue
              ? Number(yearValue)
              : null,

          poster_url:
            posterUrl || null,

          video_url:
            videoUrl,

          downloadable:
            downloadable

        });

    if (databaseError) {
      throw databaseError;
    }


    showUploadStatus(
      "✓ Movie added successfully."
    );

    document
      .getElementById("title")
      .value = "";

    document
      .getElementById("description")
      .value = "";

    document
      .getElementById("genre")
      .value = "";

    document
      .getElementById("year")
      .value = "";

    document
      .getElementById("poster")
      .value = "";

    document
      .getElementById("video")
      .value = "";

    document
      .getElementById("downloadable")
      .checked = false;

    await loadMovies();

  } catch (error) {

    console.error(
      "UPLOAD ERROR:",
      error
    );

    showUploadStatus(
      error.message ||
      "Movie upload failed.",
      true
    );

  } finally {

    button.disabled = false;
    button.textContent = "ADD MOVIE";

  }

}


/* --------------------------------
   LOAD MOVIES
-------------------------------- */

async function loadMovies() {

  const list =
    document.getElementById("movieList");

  list.innerHTML =
    "Loading movies...";

  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("movies")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (error) {
      throw error;
    }

    if (!data || data.length === 0) {

      list.innerHTML =
        "<div class='small'>No movies yet.</div>";

      return;

    }

    list.innerHTML = "";

    data.forEach(movie => {

      const item =
        document.createElement("div");

      item.className = "movie";

      item.innerHTML = `
        <div class="movie-title">
          ${escapeHtml(movie.title || "Untitled")}
        </div>

        <div class="small">
          ${escapeHtml(movie.genre || "No genre")}
          ${movie.year ? " • " + movie.year : ""}
        </div>

        <button
          class="danger"
          data-id="${movie.id}"
        >
          DELETE
        </button>
      `;

      item
        .querySelector("button")
        .addEventListener(
          "click",
          () => deleteMovie(movie)
        );

      list.appendChild(item);

    });

  } catch (error) {

    console.error(error);

    list.innerHTML =
      "<div class='small'>" +
      escapeHtml(
        error.message ||
        "Could not load movies."
      ) +
      "</div>";

  }

}


/* --------------------------------
   DELETE MOVIE
-------------------------------- */

async function deleteMovie(movie) {

  if (
    !confirm(
      "Delete " +
      movie.title +
      "?"
    )
  ) {
    return;
  }

  try {

    const {
      error
    } =
      await supabaseClient
        .from("movies")
        .delete()
        .eq(
          "id",
          movie.id
        );

    if (error) {
      throw error;
    }

    await loadMovies();

  } catch (error) {

    alert(
      error.message ||
      "Delete failed."
    );

  }

}


/* --------------------------------
   LOGOUT
-------------------------------- */

async function logoutAdmin() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* --------------------------------
   HELPERS
-------------------------------- */

function cleanFileName(name) {

  return name
    .replace(
      /[^a-zA-Z0-9._-]/g,
      "_"
    );

}


function escapeHtml(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function showLoginStatus(
  message,
  isError = false
) {

  const box =
    document.getElementById(
      "loginStatus"
    );

  box.textContent =
    message;

  box.classList.remove(
    "hidden"
  );

}


function showUploadStatus(
  message,
  isError = false
) {

  const box =
    document.getElementById(
      "uploadStatus"
    );

  box.textContent =
    message;

  box.classList.remove(
    "hidden"
  );

}

</script>

</body>
  </html>
