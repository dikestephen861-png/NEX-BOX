<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NEX BOX Admin Test</title>

  <style>
    body {
      margin: 0;
      background: #080808;
      color: white;
      font-family: Arial;
      text-align: center;
      padding: 40px 20px;
    }

    button {
      width: 100%;
      max-width: 350px;
      padding: 18px;
      margin-top: 30px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: black;
      font-size: 18px;
      font-weight: bold;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      color: #00ff88;
    }
  </style>
</head>

<body>

  <h1>NEX BOX</h1>
  <p>Admin connection test</p>

  <button id="testButton">
    TEST SIGN IN BUTTON
  </button>

  <div id="result">
    Page loaded successfully.
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const button = document.getElementById("testButton");
      const result = document.getElementById("result");

      button.addEventListener("click", function () {

        result.textContent =
          "✓ BUTTON IS WORKING";

        button.textContent =
          "WORKING";

      });

    });
  </script>

</body>
</html>
