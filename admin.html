<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEX BOX Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background:
        radial-gradient(circle at top, #222 0, #080808 55%);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      border: 1px solid #2d2d2d;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,.5);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .admin-label {
      text-align: center;
      color: #aaa;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 16px 0 7px;
      color: #ccc;
      font-size: 14px;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #333;
      background: #0e0e0e;
      color: white;
      border-radius: 10px;
      padding: 13px;
      outline: none;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #fff;
    }

    .primary {
      width: 100%;
      margin-top: 22px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: 800;
      cursor: pointer;
    }

    .primary:active {
      transform: scale(.98);
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 9px;
      background: #202020;
      color: #ddd;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .message.show {
      display: block;
    }

    /* DASHBOARD */

    #dashboard {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(8,8,8,.96);
      border-bottom: 1px solid #292929;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .top-title {
      font-size: 21px;
      font-weight: 900;
    }

    .logout {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px 15px 60px;
    }

    .welcome {
      margin-bottom: 20px;
    }

    .welcome h1 {
      margin: 0 0 7px;
      font-size: 27px;
    }

    .welcome p {
      margin: 0;
      color: #999;
    }

    .card {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 17px;
    }

    .check-row input {
      width: auto;
    }

    .upload-button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      font-weight: 900;
      cursor: pointer;
    }

    .upload-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .progress {
      margin-top: 15px;
      display: none;
      color: #ccc;
      font-size: 14px;
      line-height: 1.6;
    }

    .progress.show {
      display: block;
    }

    .movies-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .refresh {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
    }

    .movie {
      display: flex;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #292929;
    }

    .movie:last-child {
      border-bottom: 0;
    }

    .poster {
      width: 70px;
      height: 95px;
      object-fit: cover;
      border-radius: 7px;
      background: #222;
      flex-shrink: 0;
    }

    .movie-info {
      min-width: 0;
    }

    .movie-name {
      font-weight: 800;
      font-size: 16px;
      margin-bottom: 7px;
    }

    .movie-meta {
      color: #999;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 25px 5px;
    }

    @media (max-width: 650px) {
      .row {
        grid-template-columns: 1fr;
      }

      .login-box {
        padding: 23px;
      }

      .top-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->

  <section id="loginPage">

    <div class="login-box">

      <div class="logo">NEX BOX</div>

      <div class="admin-label">
        Administrator Login
      </div>

      <form id="loginForm">

        <label for="email">
          Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Admin email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
          required
        >

        <button
          id="loginButton"
          class="primary"
          type="submit"
        >
          SIGN IN
        </button>

        <div id="loginMessage" class="message"></div>

      </form>

    </div>

  </section>


  <!-- DASHBOARD -->

  <section id="dashboard" class="hidden">

    <header class="topbar">

      <div class="top-title">
        NEX BOX ADMIN
      </div>

      <button id="logoutButton" class="logout">
        Logout
      </button>

    </header>


    <main class="container">

      <div class="welcome">

        <h1>Movie Manager</h1>

        <p>
          Add movies to your NEX BOX library.
        </p>

      </div>


      <!-- ADD MOVIE -->

      <div class="card">

        <h2>Add New Movie</h2>

        <form id="movieForm">

          <label for="title">
            Movie Title *
          </label>

          <input
            id="title"
            type="text"
            placeholder="Enter movie title"
            required
          >


          <label for="description">
            Description
          </label>

          <textarea
            id="description"
            placeholder="Write a short description"
          ></textarea>


          <div class="row">

            <div>

              <label for="genre">
                Genre
              </label>

              <input
                id="genre"
                type="text"
                placeholder="Action, Drama..."
              >

            </div>


            <div>

              <label for="year">
                Year
              </label>

              <input
                id="year"
                type="number"
                placeholder="2026"
                min="1900"
                max="2100"
              >

            </div>

          </div>


          <label for="poster">
            Poster Image *
          </label>

          <input
            id="poster"
            type="file"
            accept="image/*"
            required
          >


          <label for="video">
            Movie Video *
          </label>

          <input
            id="video"
            type="file"
            accept="video/mp4,video/webm,video/quicktime"
            required
          >


          <div class="check-row">

            <input
              id="downloadable"
              type="checkbox"
              checked
            >

            <label
              for="downloadable"
              style="margin:0;"
            >
              Allow movie download
            </label>

          </div>


          <button
            id="uploadButton"
            class="upload-button"
            type="submit"
          >
            ADD MOVIE
          </button>


          <div
            id="uploadProgress"
            class="progress"
          ></div>

        </form>

      </div>


      <!-- MOVIE LIST -->

      <div class="card">

        <div class="movies-title">

          <h2 style="margin:0;">
            Movies in NEX BOX
          </h2>

          <button
            id="refreshButton"
            class="refresh"
            type="button"
          >
            Refresh
          </button>

        </div>


        <div id="movieList">
          <div class="empty">
            Loading movies...
          </div>
        </div>

      </div>

    </main>

  </section>


  <script>

    /* ==============================
       SUPABASE
    ============================== */

    const SUPABASE_URL =
      "https://jacxlmcwwedertcaizdj.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    /* ==============================
       ELEMENTS
    ============================== */

    const loginPage =
      document.getElementById("loginPage");

    const dashboard =
      document.getElementById("dashboard");

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const logoutButton =
      document.getElementById("logoutButton");

    const movieForm =
      document.getElementById("movieForm");

    const uploadButton =
      document.getElementById("uploadButton");

    const uploadProgress =
      document.getElementById("uploadProgress");

    const movieList =
      document.getElementById("movieList");

    const refreshButton =
      document.getElementById("refreshButton");


    /* ==============================
       MESSAGE
    ============================== */

    function showLoginMessage(message) {

      loginMessage.textContent = message;

      loginMessage.classList.add("show");

    }


    function showProgress(message) {

      uploadProgress.textContent = message;

      uploadProgress.classList.add("show");

    }


    function hideProgress() {

      uploadProgress.textContent = "";

      uploadProgress.classList.remove("show");

    }


    /* ==============================
       LOGIN
    ============================== */

    loginForm.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        loginButton.disabled = true;

        loginButton.textContent = "SIGNING IN...";

        loginMessage.classList.remove("show");

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;


        try {

          const { data, error } =
            await supabaseClient.auth.signInWithPassword({
              email: email,
              password: password
            });


          if (error) {
            throw error;
          }


          if (!data.user) {
            throw new Error(
              "Login did not return a user."
            );
          }


          /* Check admin_users */

          const { data: admin, error: adminError } =
            await supabaseClient
              .from("admin_users")
              .select("user_id,email")
              .eq("user_id", data.user.id)
              .maybeSingle();


          if (adminError) {
            throw adminError;
          }


          if (!admin) {

            await supabaseClient.auth.signOut();

            throw new Error(
              "This account is not registered as a NEX BOX administrator."
            );

          }


          loginPage.classList.add("hidden");

          dashboard.classList.remove("hidden");

          await loadMovies();


        } catch (error) {

          console.error(error);

          showLoginMessage(
            error.message ||
            "Login failed. Check your email and password."
          );

        } finally {

          loginButton.disabled = false;

          loginButton.textContent = "SIGN IN";

        }

      }
    );


    /* ==============================
       SESSION CHECK
    ============================== */

    async function checkSession() {

      try {

        const {
          data: {
            session
          }
        } = await
