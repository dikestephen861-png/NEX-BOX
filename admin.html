<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080808">

<title>NEX BOX Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#080808;
  color:#fff;
  min-height:100vh;
}

.hidden{
  display:none!important;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px;
}

.logo{
  text-align:center;
  font-size:28px;
  font-weight:900;
  letter-spacing:2px;
  margin:20px 0 5px;
}

.sub{
  text-align:center;
  color:#888;
  margin-bottom:25px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:15px;
  padding:20px;
  margin-bottom:20px;
}

h2{
  margin-bottom:18px;
}

label{
  display:block;
  margin:14px 0 7px;
  color:#ccc;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  background:#0d0d0d;
  color:#fff;
  border:1px solid #333;
  border-radius:9px;
  padding:13px;
  font-size:15px;
}

textarea{
  min-height:100px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  outline:none;
  border-color:#fff;
}

button{
  width:100%;
  border:0;
  border-radius:9px;
  padding:14px;
  margin-top:15px;
  background:#fff;
  color:#000;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

button.secondary{
  background:#252525;
  color:#fff;
}

button.danger{
  background:#b00020;
  color:#fff;
}

.status{
  padding:12px;
  border-radius:9px;
  margin-top:15px;
  background:#101010;
  color:#aaa;
  display:none;
}

.status.show{
  display:block;
}

.status.success{
  color:#7dff9b;
}

.status.error{
  color:#ff6f6f;
}

.progress{
  margin-top:15px;
  display:none;
}

.progress.show{
  display:block;
}

.progress-bar{
  width:100%;
  height:8px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:#fff;
}

.movie{
  display:flex;
  gap:15px;
  padding:14px 0;
  border-bottom:1px solid #292929;
}

.movie:last-child{
  border-bottom:0;
}

.movie img{
  width:75px;
  height:105px;
  object-fit:cover;
  border-radius:7px;
  background:#222;
}

.movie-info{
  flex:1;
}

.movie-title{
  font-weight:bold;
  font-size:17px;
  margin-bottom:7px;
}

.movie-meta{
  color:#888;
  font-size:13px;
  margin-bottom:8px;
}

.movie button{
  width:auto;
  padding:8px 12px;
  margin:5px 0 0;
  font-size:12px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
}

.topbar button{
  width:auto;
  margin:0;
  padding:10px 15px;
}

.file-name{
  color:#888;
  font-size:13px;
  margin-top:7px;
}

.check{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:15px;
}

.check input{
  width:auto;
}

@media(max-width:600px){
  .container{
    padding:14px;
  }

  .movie img{
    width:65px;
    height:90px;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="logo">NEX BOX</div>
  <div class="sub">Admin Dashboard</div>

  <!-- LOGIN -->
  <section id="loginSection" class="card">

    <h2>Admin Login</h2>

    <label>Email</label>
    <input
      id="email"
      type="email"
      value="dikestephen861@gmail.com"
      autocomplete="email"
    >

    <label>Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter your Supabase password"
      autocomplete="current-password"
    >

    <button id="loginBtn">LOGIN</button>

    <div id="loginStatus" class="status"></div>

  </section>


  <!-- DASHBOARD -->
  <section id="dashboardSection" class="hidden">

    <div class="topbar">
      <div>
        <strong>Admin Dashboard</strong>
      </div>

      <button id="logoutBtn" class="secondary">
        Logout
      </button>
    </div>


    <!-- ADD MOVIE -->
    <div class="card">

      <h2>Add New Movie</h2>

      <form id="movieForm">

        <label>Movie Title</label>
        <input
          id="title"
          type="text"
          placeholder="Enter movie title"
          required
        >

        <label>Description</label>
        <textarea
          id="description"
          placeholder="Write a short description"
        ></textarea>

        <label>Genre</label>
        <input
          id="genre"
          type="text"
          placeholder="Action, Drama, Comedy..."
        >

        <label>Year</label>
        <input
          id="year"
          type="number"
          placeholder="2026"
        >

        <label>Poster Image</label>
        <input
          id="poster"
          type="file"
          accept="image/*"
          required
        >

        <div id="posterName" class="file-name">
          No poster selected
        </div>

        <label>Movie Video</label>
        <input
          id="video"
          type="file"
          accept="video/mp4,video/*"
          required
        >

        <div id="videoName" class="file-name">
          No video selected
        </div>

        <div class="check">
          <input
            id="downloadable"
            type="checkbox"
            checked
          >

          <label for="downloadable">
            Allow download
          </label>
        </div>

        <button id="uploadBtn" type="submit">
          UPLOAD MOVIE
        </button>

      </form>

      <div id="uploadStatus" class="status"></div>

      <div id="progress" class="progress">
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
      </div>

    </div>


    <!-- MOVIE LIST -->
    <div class="card">

      <h2>Movies</h2>

      <div id="movieList">
        Loading movies...
      </div>

    </div>

  </section>

</div>


<script>

const SUPABASE_KEY =

const progressFill =

function showStatus(element,message,type=""){
  element.textContent = message;
  element.className = "status show " + type;
}


function setProgress(value){
  progress.classList.add("show");
  progressFill.style.width = value + "%";
}


posterInput.addEventListener("change",()=>{
  if(posterInput.files.length){
    posterName.textContent =
      posterInput.files[0].name;
  }
});


videoInput.addEventListener("change",()=>{
  if(videoInput.files.length){
    videoName.textContent =
      videoInput.files[0].name;
  }
});


async function checkAdmin(user){

  const { data, error } =
    await supabaseClient
      .from("admin_users")
      .select("user_id,email")
      .eq("user_id",user.id)
      .maybeSingle();

  if(error){
    console.error(error);
    throw new Error(
      "Could not verify admin account: " +
      error.message
    );
  }

  if(!data){
    throw new Error(
      "This account is not registered as an NEX BOX admin."
    );
  }

  return true;
}
