<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEX BOX ADMIN</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,sans-serif;
}

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.box{
  width:100%;
  max-width:400px;
  background:#151515;
  padding:25px;
  border-radius:18px;
  border:1px solid #333;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  margin-bottom:8px;
}

.logo span{
  color:#e50914;
}

.subtitle{
  text-align:center;
  color:#aaa;
  margin-bottom:25px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ddd;
}

input{
  width:100%;
  height:52px;
  background:#080808;
  border:1px solid #444;
  border-radius:10px;
  padding:0 14px;
  color:white;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#e50914;
}

button{
  width:100%;
  height:54px;
  margin-top:20px;
  background:#e50914;
  border:0;
  border-radius:10px;
  color:white;
  font-size:16px;
  font-weight:bold;
}

button:active{
  transform:scale(.97);
}

#message{
  margin-top:15px;
  padding:12px;
  border-radius:8px;
  display:none;
  line-height:1.5;
}

.error{
  display:block !important;
  background:#350d0d;
  color:#ff8f8f;
}

.success{
  display:block !important;
  background:#0d3515;
  color:#8cff99;
}

#adminPage{
  display:none;
  min-height:100vh;
}

.header{
  height:65px;
  background:#111;
  border-bottom:1px solid #333;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.headerTitle{
  font-size:20px;
  font-weight:bold;
}

.headerTitle span{
  color:#e50914;
}

.logout{
  width:auto;
  height:40px;
  margin:0;
  padding:0 15px;
  background:#222;
  border:1px solid #444;
}

.content{
  max-width:900px;
  margin:auto;
  padding:20px 15px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

.card h2{
  margin-top:0;
}

.red{
  background:#e50914;
}

#movies{
  color:#aaa;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginPage">

  <div class="box">

    <div class="logo">
      NEX <span>BOX</span>
    </div>

    <div class="subtitle">
      Administrator Login
    </div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      value=""
      placeholder="Admin email"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Password"
    >

    <!-- IMPORTANT: DIRECT CLICK HANDLER -->
    <button
      type="button"
      onclick="loginNow()"
    >
      SIGN IN
    </button>

    <div id="message"></div>

  </div>

</div>


<!-- ADMIN -->

<div id="adminPage">

  <div class="header">

    <div class="headerTitle">
      NEX <span>BOX</span> ADMIN
    </div>

    <button
      class="logout"
      type="button"
      onclick="logoutNow()"
    >
      LOGOUT
    </button>

  </div>

  <div class="content">

    <div class="card">

      <h2>Admin Dashboard</h2>

      <p>
        You are successfully signed in to NEX BOX Admin.
      </p>

    </div>

    <div class="card">

      <h2>Movies</h2>

      <div id="movies">
        Loading movies...
      </div>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";


function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.textContent = text;

  box.className = type || "";

}


async function loginNow(){

  showMessage(
    "LOGIN BUTTON CLICKED. Connecting...",
    "success"
  );

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if(!email){

    showMessage(
      "Enter your email.",
      "error"
    );

    return;
  }


  if(!password){

    showMessage(
      "Enter your password.",
      "error"
    );

    return;
  }


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      showMessage(
        data.msg ||
        data.message ||
        data.error_description ||
        "Login failed.",
        "error"
      );

      return;
    }


    if(!data.access_token){

      showMessage(
        "Supabase did not return a login session.",
        "error"
      );

      return;
    }


    showMessage(
      "Login successful. Opening Admin...",
      "success"
    );


    localStorage.setItem(
      "nexbox_access_token",
      data.access_token
    );

    localStorage.setItem(
      "nexbox_refresh_token",
      data.refresh_token || ""
    );


    setTimeout(function(){

      document.getElementById(
        "loginPage"
      ).style.display="none";

      document.getElementById(
        "adminPage"
      ).style.display="block";

      loadMovies(data.access_token);

    },500);


  }catch(error){

    showMessage(
      "Connection error: " +
      error.message,
      "error"
    );

  }

}


async function loadMovies(token){

  const movies =
    document.getElementById("movies");


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/movies?select=*&order=created_at.desc",
        {
          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + token
          }
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      movies.textContent =
        "Could not load movies: " +
        (data.message || "Unknown error");

      return;
    }


    if(!data.length){

      movies.textContent =
        "No movies have been added yet.";

      return;
    }


    movies.innerHTML =
      data.map(function(movie){

        return `
          <div style="
            padding:12px 0;
            border-bottom:1px solid #333;
          ">
            <strong>
              ${escapeHtml(movie.title || "Untitled")}
            </strong>
            <br>
            <small style="color:#888">
              ${escapeHtml(movie.genre || "")}
            </small>
          </div>
        `;

      }).join("");


  }catch(error){

    movies.textContent =
      error.message;

  }

}


function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function logoutNow(){

  localStorage.removeItem(
    "nexbox_access_token"
  );

  localStorage.removeItem(
    "nexbox_refresh_token"
  );

  document.getElementById(
    "adminPage"
  ).style.display="none";

  document.getElementById(
    "loginPage"
  ).style.display="flex";

  showMessage(
    "You have been logged out.",
    "success"
  );

}

</script>

</body>
</html>
