<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEX BOX ADMIN</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
  touch-action:manipulation;
}

.hidden{
  display:none!important;
}

/* LOGIN */

#loginPage{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#292929,#050505 55%);
}

.login-box{
  width:100%;
  max-width:420px;
  background:#151515;
  border:1px solid #333;
  border-radius:18px;
  padding:28px 22px;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:900;
  letter-spacing:2px;
}

.logo span{
  color:#e50914;
}

.subtitle{
  text-align:center;
  color:#999;
  margin:8px 0 25px;
}

label{
  display:block;
  margin:15px 0 7px;
  color:#ddd;
  font-size:14px;
}

input,
textarea,
select{
  width:100%;
  background:#090909;
  color:#fff;
  border:1px solid #3a3a3a;
  border-radius:10px;
  outline:none;
}

input{
  height:50px;
  padding:0 14px;
}

textarea{
  min-height:110px;
  padding:13px;
  resize:vertical;
}

select{
  height:50px;
  padding:0 12px;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#e50914;
}

.login-btn,
.primary-btn{
  width:100%;
  height:52px;
  margin-top:20px;
  border:0;
  border-radius:10px;
  background:#e50914;
  color:#fff;
  font-weight:800;
}

.login-btn:active,
.primary-btn:active{
  transform:scale(.98);
}

.login-btn:disabled,
.primary-btn:disabled{
  opacity:.55;
  cursor:wait;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:9px;
  font-size:14px;
  line-height:1.45;
}

.message.show{
  display:block;
}

.message.error{
  background:#350d0d;
  border:1px solid #762020;
  color:#ff9494;
}

.message.success{
  background:#0d3515;
  border:1px solid #20762b;
  color:#91ff9c;
}

/* ADMIN */

#adminPage{
  min-height:100vh;
  background:#080808;
}

.header{
  position:sticky;
  top:0;
  z-index:20;
  height:64px;
  background:#111;
  border-bottom:1px solid #292929;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
}

.header-title{
  font-size:20px;
  font-weight:900;
}

.header-title span{
  color:#e50914;
}

.logout-btn{
  width:auto;
  height:40px;
  margin:0;
  padding:0 14px;
  background:#222;
  border:1px solid #444;
  color:#fff;
  border-radius:8px;
}

.container{
  width:100%;
  max-width:900px;
  margin:auto;
  padding:20px 15px 60px;
}

.card{
  background:#151515;
  border:1px solid #292929;
  border-radius:15px;
  padding:18px;
  margin-bottom:18px;
}

.card h2{
  margin:0 0 17px;
  font-size:19px;
}

.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:5px 15px;
}

.full{
  grid-column:1/-1;
}

.file-box{
  background:#090909;
  border:1px dashed #444;
  border-radius:10px;
  padding:10px;
}

.file-box input{
  height:auto;
  border:0;
  padding:8px;
}

.preview{
  display:none;
  width:100px;
  height:140px;
  object-fit:cover;
  border-radius:8px;
  margin-top:10px;
}

.progress{
  display:none;
  margin-top:15px;
}

.progress-bar{
  height:8px;
  background:#292929;
  border-radius:20px;
  overflow:hidden;
}

.progress-inner{
  width:0%;
  height:100%;
  background:#e50914;
}

.progress-text{
  color:#aaa;
  font-size:13px;
  margin-top:6px;
}

.movie-item{
  display:flex;
  gap:13px;
  padding:13px 0;
  border-bottom:1px solid #292929;
}

.movie-item:last-child{
  border-bottom:0;
}

.movie-poster{
  width:70px;
  height:95px;
  object-fit:cover;
  border-radius:7px;
  background:#222;
  flex-shrink:0;
}

.movie-info{
  flex:1;
  min-width:0;
}

.movie-title{
  font-weight:800;
  margin-bottom:6px;
}

.movie-meta{
  color:#999;
  font-size:13px;
  line-height:1.5;
}

.delete-btn{
  width:auto;
  height:38px;
  padding:0 12px;
  margin-top:8px;
  border:1px solid #762020;
  background:#250b0b;
  color:#ff8888;
  border-radius:7px;
}

.refresh-btn{
  width:auto;
  height:40px;
  padding:0 14px;
  margin:0 0 15px;
  border:1px solid #444;
  background:#222;
  color:#fff;
  border-radius:8px;
}

.empty{
  text-align:center;
  color:#888;
  padding:20px 0;
}

.hint{
  color:#888;
  font-size:12px;
  line-height:1.5;
  margin-top:8px;
}

@media(min-width:650px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

}
</style>
</head>

<body>

<!-- LOGIN -->

<section id="loginPage">

  <div class="login-box">

    <div class="logo">
      NEX <span>BOX</span>
    </div>

    <div class="subtitle">
      Administrator Login
    </div>

    <label>Email</label>

    <input
      id="email"
      type="email"
      placeholder="Admin email"
      autocomplete="username"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      class="login-btn"
      onclick="loginNow()"
    >
      SIGN IN
    </button>

    <div id="loginMessage" class="message"></div>

  </div>

</section>


<!-- ADMIN -->

<section id="adminPage" class="hidden">

  <header class="header">

    <div class="header-title">
      NEX <span>BOX</span> ADMIN
    </div>

    <button
      type="button"
      class="logout-btn"
      onclick="logoutNow()"
    >
      LOGOUT
    </button>

  </header>


  <main class="container">

    <!-- ADD MOVIE -->

    <section class="card">

      <h2>🎬 Add New Movie</h2>

      <div class="grid">

        <div>
          <label>Movie Title</label>

          <input
            id="movieTitle"
            type="text"
            placeholder="Enter movie title"
          >
        </div>


        <div>
          <label>Genre</label>

          <input
            id="movieGenre"
            type="text"
            placeholder="Action, Drama, Comedy..."
          >
        </div>


        <div>
          <label>Release Year</label>

          <input
            id="movieYear"
            type="number"
            placeholder="2026"
          >
        </div>


        <div>
          <label>Allow Download</label>

          <select id="downloadable">

            <option value="true">
              Yes
            </option>

            <option value="false">
              No
            </option>

          </select>

        </div>


        <div class="full">

          <label>Description</label>

          <textarea
            id="movieDescription"
            placeholder="Write a description for the movie..."
          ></textarea>

        </div>


        <div>

          <label>Movie Poster</label>

          <div class="file-box">

            <input
              id="posterFile"
              type="file"
              accept="image/*"
              onchange="previewPoster()"
            >

            <img
              id="posterPreview"
              class="preview"
              alt="Poster preview"
            >

          </div>

          <div class="hint">
            JPG, PNG or WEBP recommended.
          </div>

        </div>


        <div>

          <label>Movie Video</label>

          <div class="file-box">

            <input
              id="videoFile"
              type="file"
              accept="video/mp4,video/webm,video/*"
            >

          </div>

          <div class="hint">
            MP4 is recommended for browser playback.
          </div>

        </div>

      </div>


      <button
        type="button"
        id="uploadButton"
        class="primary-btn"
        onclick="addMovie()"
      >
        ADD MOVIE
      </button>


      <div id="uploadMessage" class="message"></div>


      <div id="progress" class="progress">

        <div class="progress-bar">
          <div
            id="progressInner"
            class="progress-inner"
          ></div>
        </div>

        <div
          id="progressText"
          class="progress-text"
        >
          Preparing upload...
        </div>

      </div>

    </section>


    <!-- MOVIES -->

    <section class="card">

      <h2>📚 NEX BOX Movies</h2>

      <button
        type="button"
        class="refresh-btn"
        onclick="loadMovies()"
      >
        🔄 Refresh
      </button>

      <div id="movieList">
        <div class="empty">
          Loading movies...
        </div>
      </div>

    </section>

  </main>

</section>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";


let accessToken = null;


/* ================================
   HELPERS
================================ */

function message(elementId,text,type){

  const element =
    document.getElementById(elementId);

  element.textContent = text;

  element.className =
    "message show " + type;

}


function clearMessage(elementId){

  const element =
    document.getElementById(elementId);

  element.textContent = "";

  element.className = "message";

}


function safe(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function cleanFileName(name){

  return name.replace(
    /[^a-zA-Z0-9._-]/g,
    "_"
  );

}


/* ================================
   LOGIN
================================ */

async function loginNow(){

  message(
    "loginMessage",
    "Connecting to NEX BOX...",
    "success"
  );


  const email =
    document.getElementById("email")
    .value
    .trim();

  const password =
    document.getElementById("password")
    .value;


  if(!email){

    message(
      "loginMessage",
      "Enter your email.",
      "error"
    );

    return;
  }


  if(!password){

    message(
      "loginMessage",
      "Enter your password.",
      "error"
    );

    return;
  }


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "Content-Type":"application/json",
            "apikey":SUPABASE_KEY
          },

          body:JSON.stringify({
            email:email,
            password:password
          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      message(
        "loginMessage",
        data.msg ||
        data.message ||
        data.error_description ||
        "Login failed.",
        "error"
      );

      return;
    }


    accessToken =
      data.access_token;


    localStorage.setItem(
      "nexbox_access_token",
      accessToken
    );


    message(
      "loginMessage",
      "Login successful.",
      "success"
    );


    setTimeout(function(){

      document
        .getElementById("loginPage")
        .classList.add("hidden");

      document
        .getElementById("adminPage")
        .classList.remove("hidden");

      loadMovies();

    },500);


  }catch(error){

    message(
      "loginMessage",
      "Connection error: " +
      error.message,
      "error"
    );

  }

}


/* ================================
   LOGOUT
================================ */

function logoutNow(){

  localStorage.removeItem(
    "nexbox_access_token"
  );

  accessToken = null;

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* ================================
   POSTER PREVIEW
================================ */

function previewPoster(){

  const file =
    document
      .getElementById("posterFile")
      .files[0];

  const preview =
    document.getElementById(
      "posterPreview"
    );


  if(!file){

    preview.style.display="none";

    return;
  }


  preview.src =
    URL.createObjectURL(file);

  preview.style.display="block";

}


/* ================================
   ADD MOVIE
================================ */

async function addMovie(){

  clearMessage("uploadMessage");


  if(!accessToken){

    accessToken =
      localStorage.getItem(
        "nexbox_access_token"
      );

  }


  if(!accessToken){

    message(
      "uploadMessage",
      "Please sign in again.",
      "error"
    );

    return;
  }


  const title =
    document
      .getElementById("movieTitle")
      .value
      .trim();

  const description =
    document
      .getElementById("movieDescription")
      .value
      .trim();

  const genre =
    document
      .getElementById("movieGenre")
      .value
      .trim();

  const year =
    document
      .getElementById("movieYear")
      .value;

  const downloadable =
    document
      .getElementById("downloadable")
      .value === "true";

  const poster =
    document
      .getElementById("posterFile")
      .files[0];

  const video =
    document
      .getElementById("videoFile")
      .files[0];


  if(!title){

    message(
      "uploadMessage",
      "Enter the movie title.",
      "error"
    );

    return;
  }


  if(!poster){

    message(
      "uploadMessage",
      "Select a movie poster.",
      "error"
    );

    return;
  }


  if(!video){

    message(
      "uploadMessage",
      "Select the movie video.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "uploadButton"
    );

  button.disabled = true;

  button.textContent =
    "UPLOADING...";


  const progress =
    document.getElementById("progress");

  const progressInner =
    document.getElementById(
      "progressInner"
    );

  const progressText =
    document.getElementById(
      "progressText"
    );


  progress.style.display="block";


  try{

    /* POSTER */

    progressText.textContent =
      "Uploading poster...";

    progressInner.style.width =
      "20%";


    const posterPath =
      "posters/" +
      Date.now() +
      "_" +
      cleanFileName(poster.name);


    const posterResponse =
      await fetch(
        SUPABASE_URL +
        "/storage/v1/object/Posters/" +
        posterPath,
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + accessToken,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              poster.type ||
              "application/octet-stream"
          },

          body:poster
        }
      );


    const posterResult =
      await posterResponse.json();


    if(!posterResponse.ok){

      throw new Error(
        "Poster upload failed: " +
        (
          posterResult.message ||
          posterResult.error ||
          "Unknown error"
        )
      );

    }


    const posterUrl =
      SUPABASE_URL +
      "/storage/v1/object/public/Posters/" +
      posterPath;


    /* VIDEO */

    progressText.textContent =
      "Uploading video...";

    progressInner.style.width =
      "50%";


    const videoPath =
      "videos/" +
      Date.now() +
      "_" +
      cleanFileName(video.name);


    const videoResponse =
      await fetch(
        SUPABASE_URL +
        "/storage/v1/object/Videos/" +
        videoPath,
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + accessToken,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              video.type ||
              "video/mp4"
          },

          body:video
        }
      );


    const videoResult =
      await videoResponse.json();


    if(!videoResponse.ok){

      throw new Error(
        "Video upload failed: " +
        (
          videoResult.message ||
          videoResult.error ||
          "Unknown error"
        )
      );

    }


    const videoUrl =
      SUPABASE_URL +
      "/storage/v1/object/public/Videos/" +
      videoPath;


    /* DATABASE */

    progressText.textContent =
      "Saving movie...";

    progressInner.style.width =
      "80%";


    const movieResponse =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/movies",
        {
          method:"POST",

          headers:{
            "Authorization":
              "Bearer " + accessToken,

            "apikey":
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"
          },

          body:JSON.stringify({

            title:title,

            description:
              description || null,

            genre:
              genre || null,

            year:
              year
                ? Number(year)
                : null,

            poster_url:
              posterUrl,

            video_url:
              videoUrl,

            downloadable:
              downloadable

          })
        }
      );


    const movieResult =
      await movieResponse.json();


    if(!movieResponse.ok){

      throw new Error(
        "Database save failed: " +
        (
          movieResult.message ||
          movieResult.error ||
          "Unknown error"
        )
      );

    }


    progressInner.style.width =
      "100%";

    progressText.textContent =
      "Movie added successfully!";


    message(
      "uploadMessage",
      "🎉 Movie uploaded and saved to NEX BOX.",
      "success"
    );


    /* CLEAR */

    document.getElementById(
      "movieTitle"
    ).value="";

    document.getElementById(
      "movieDescription"
    ).value="";

    document.getElementById(
      "movieGenre"
    ).value="";

    document.getElementById(
      "movieYear"
    ).value="";

    document.getElementById(
      "posterFile"
    ).value="";

    document.getElementById(
      "videoFile"
    ).value="";

    document.getElementById(
      "posterPreview"
    ).style.display="none";


    loadMovies();


  }catch(error){

    console.error(error);

    message(
      "uploadMessage",
      error.message ||
      "Movie upload failed.",
      "error"
    );


  }finally{

    button.disabled=false;

    button.textContent =
      "ADD MOVIE";

  }

}


/* ================================
   LOAD MOVIES
================================ */

async function loadMovies(){

  const list =
    document.getElementById(
      "movieList"
    );


  if(!accessToken){

    accessToken =
      localStorage.getItem(
        "nexbox_access_token"
      );

  }


  if(!accessToken){

    list.innerHTML =
      '<div class="empty">Please sign in.</div>';

    return;
  }


  list.innerHTML =
    '<div class="empty">Loading movies...</div>';


  try{

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/movies?select=*&order=created_at.desc",
        {
          headers:{
            "apikey":SUPABASE_KEY,

            "Authorization":
              "Bearer " + accessToken
          }
        }
      );


    const movies =
      await response.json();


    if(!response.ok){

      throw new Error(
        movies.message ||
        "Could not load movies."
      );

    }


    if(!movies.length){

      list.innerHTML =
        '<div class="empty">' +
        'No movies added yet.' +
        '</div>';

      return;
    }


    list.innerHTML =
      movies.map(function(movie){

        return `

          <div class="movie-item">

            <img
              class="movie-poster"
              src="${safe(movie.poster_url)}"
              onerror="this.style.display='none'"
            >

            <div class="movie-info">

              <div class="movie-title">
                ${safe(movie.title)}
              </div>

              <div class="movie-meta">

                Genre:
                ${safe(movie.genre || "Not set")}
