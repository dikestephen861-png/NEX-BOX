<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEX BOX Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.box{
    width:90%;
    max-width:400px;
    margin:80px auto;
    padding:25px;
    background:#111;
    border-radius:15px;
}

h1{
    text-align:center;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:14px;
    margin:8px 0;
    background:#222;
    color:#fff;
    border:1px solid #444;
    border-radius:8px;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    background:#fff;
    color:#000;
    border:0;
    border-radius:8px;
    font-weight:bold;
    font-size:16px;
}

#message{
    margin-top:15px;
    text-align:center;
}
</style>
</head>

<body>

<div class="box">

<h1>NEX BOX</h1>

<p style="text-align:center;color:#aaa;">
Admin Login
</p>

<input
id="email"
type="email"
value="dikestephen861@gmail.com"
placeholder="Email"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button id="loginButton" type="button">
LOGIN
</button>

<div id="message"></div>

</div>


<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const client =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


document
.getElementById("loginButton")
.addEventListener("click", async function(){

    const message =
    document.getElementById("message");

    const email =
    document.getElementById("email").value.trim();

    const password =
    document.getElementById("password").value;

    message.textContent =
    "LOGIN BUTTON WORKED";

    try{

        const result =
        await client.auth.signInWithPassword({
            email:email,
            password:password
        });

        if(result.error){

            message.textContent =
            result.error.message;

            return;
        }

        message.textContent =
        "LOGIN SUCCESSFUL ✓";

    }catch(error){

        message.textContent =
        error.message;

    }

});

</script>

</body>
</html>
