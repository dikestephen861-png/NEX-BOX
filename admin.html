<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEX BOX ADMIN</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background: #080808;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
      touch-action: manipulation;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(circle at top, #292929 0%, #080808 45%, #000 100%);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 30px 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.6);
    }

    .logo {
      text-align: center;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    .logo span {
      color: #e50914;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 28px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      color: #ddd;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #090909;
      color: white;
      outline: none;
    }

    input:focus {
      border-color: #e50914;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 10px;
      background: #e50914;
      color: white;
      font-weight: 800;
      font-size: 16px;
    }

    .login-button:active {
      transform: scale(.98);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #loginMessage {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.4;
      display: none;
    }

    #loginMessage.error {
      display: block;
      background: #351010;
      color: #ff8c8c;
      border: 1px solid #762020;
    }

    #loginMessage.success {
      display: block;
      background: #103518;
      color: #8cff9a;
      border: 1px solid #20762b;
    }

    /* ADMIN */

    #adminPage {
      min-height: 100vh;
      background: #090909;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      height: 64px;
      background: #111;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .top-title {
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 1px;
    }

    .top-title span {
      color: #e50914;
    }

    .logout-button {
      border: 1px solid #444;
      background: #1d1d1d;
      color: white;
      padding: 9px 14px;
      border-radius: 8px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px 16px 50px;
    }

    .panel {
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .panel h2 {
      margin: 0 0 16px;
      font-size: 19px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    textarea {
      width: 100%;
      min-height: 100px;
      resize: vertical;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: #090909;
      color: white;
      outline: none;
    }

    textarea:focus {
      border-color: #e50914;
    }

    .upload-box {
      border: 1px dashed #444;
      border-radius: 10px;
      padding: 15px;
      background: #0c0c0c;
    }

    .upload-box input {
      height: auto;
      padding: 10px;
      border: 0;
      background: transparent;
    }

    .main-button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 10px;
      background: #e50914;
      color: white;
      font-weight: 800;
      margin-top: 16px;
    }

    .main-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      display: none;
      margin-top: 14px;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.4;
      font-size: 14px;
    }

    .status.show {
      display: block;
    }

    .status.error {
      background: #351010;
      border: 1px solid #762020;
      color: #ff9696;
    }

    .status.success {
      background: #103518;
      border: 1px solid #20762b;
      color: #91ff9b;
    }

    .movie-item {
      display: flex;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid #292929;
    }

    .movie-item:last-child {
      border-bottom: 0;
    }

    .movie-poster {
      width: 70px;
      height: 95px;
      border-radius: 7px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .movie-info {
      min-width: 0;
    }

    .movie-title {
      font-weight: 800;
      margin-bottom: 7px;
    }

    .movie-meta {
      color: #999;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty {
      color: #888;
      text-align: center;
      padding: 20px 0;
    }

    @media (min-width: 650px) {
      .grid {
        grid-template-columns: 1fr 1fr;
      }

      .full {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

  <!-- LOGIN PAGE -->

  <section id="loginPage">

    <div class="login-box">

      <div class="logo">
        NEX <span>BOX</span>
      </div>

      <div class="subtitle">
        Administrator Login
      </div>

      <form id="loginForm">

        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          autocomplete="username"
          placeholder="Enter admin email"
          required
        >

        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
          required
        >

        <button
          id="loginButton"
          class="login-button"
          type="submit"
        >
          SIGN IN
        </button>

      </form>

      <div id="loginMessage"></div>

    </div>

  </section>


  <!-- ADMIN PAGE -->

  <section id="adminPage" class="hidden">

    <header class="topbar">

      <div class="top-title">
        NEX <span>BOX</span> ADMIN
      </div>

      <button
        id="logoutButton"
        class="logout-button"
        type="button"
      >
        Logout
      </button>

    </header>


    <main class="container">

      <!-- ADD MOVIE -->

      <section class="panel">

        <h2>Add Movie</h2>

        <div class="grid">

          <div>
            <label for="movieTitle">Movie Title</label>

            <input
              id="movieTitle"
              type="text"
              placeholder="Movie title"
            >
          </div>


          <div>
            <label for="movieGenre">Genre</label>

            <input
              id="movieGenre"
              type="text"
              placeholder="Action, Drama..."
            >
          </div>


          <div>
            <label for="movieYear">Year</label>

            <input
              id="movieYear"
              type="number"
              placeholder="2026"
            >
          </div>


          <div>
            <label for="downloadable">Downloadable</label>

            <select
              id="downloadable"
              style="
                width:100%;
                height:50px;
                padding:0 12px;
                border-radius:10px;
                border:1px solid #3a3a3a;
                background:#090909;
                color:white;
              "
            >
              <option value="true">Yes</option>
              <option value="false">No</option>
            </select>
          </div>


          <div class="full">

            <label for="movieDescription">
              Description
            </label>

            <textarea
              id="movieDescription"
              placeholder="Write a short movie description..."
            ></textarea>

          </div>


          <div>

            <label>Movie Poster</label>

            <div class="upload-box">

              <input
                id="posterFile"
                type="file"
                accept="image/*"
              >

            </div>

          </div>


          <div>

            <label>Movie Video</label>

            <div class="upload-box">

              <input
                id="videoFile"
                type="file"
                accept="video/mp4,video/webm,video/*"
              >

            </div>

          </div>

        </div>


        <button
          id="addMovieButton"
          class="main-button"
          type="button"
        >
          ADD MOVIE
        </button>

        <div
          id="movieStatus"
          class="status"
        ></div>

      </section>


      <!-- MOVIES -->

      <section class="panel">

        <h2>Movies in NEX BOX</h2>

        <div id="movieList">

          <div class="empty">
            Loading movies...
          </div>

        </div>

      </section>

    </main>

  </section>


<script>

  /*
   * NEX BOX SUPABASE
   */

  const SUPABASE_URL =
    "https://jacxlmcwwedertcaizdj.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
   * ELEMENTS
   */

  const loginPage =
    document.getElementById("loginPage");

  const adminPage =
    document.getElementById("adminPage");

  const loginForm =
    document.getElementById("loginForm");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const logoutButton =
    document.getElementById("logoutButton");

  const addMovieButton =
    document.getElementById("addMovieButton");

  const movieStatus =
    document.getElementById("movieStatus");

  const movieList =
    document.getElementById("movieList");


  /*
   * MESSAGE HELPERS
   */

  function showLoginMessage(message, type) {

    loginMessage.textContent = message;

    loginMessage.className = "";

    loginMessage.classList.add(type);

  }


  function clearLoginMessage() {

    loginMessage.textContent = "";

    loginMessage.className = "";

  }


  function showMovieStatus(message, type) {

    movieStatus.textContent = message;

    movieStatus.className = "status show " + type;

  }


  /*
   * LOGIN
   */

  loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    clearLoginMessage();

    const email =
      document.getElementById("email")
      .value
      .trim();

    const password =
      document.getElementById("password")
      .value;


    if (!email || !password) {

      showLoginMessage(
        "Please enter your email and password.",
        "error"
      );

      return;

    }


    loginButton.disabled = true;

    loginButton.textContent = "SIGNING IN...";


    try {

      const result =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (result.error) {

        console.error(
          "Supabase login error:",
          result.error
        );

        showLoginMessage(
          result.error.message ||
          "Login failed.",
          "error"
        );

        return;

      }


      if (!result.data || !result.data.user) {

        showLoginMessage(
          "Login completed, but no user session was returned.",
          "error"
        );

        return;

      }


      showLoginMessage(
        "Login successful. Checking admin access...",
        "success"
      );


      const user =
        result.data.user;


      /*
       * CHECK ADMIN TABLE
       */

      const adminCheck =
        await supabaseClient
          .from("admin_users")
          .select("user_id,email")
          .eq("user_id", user.id)
          .maybeSingle();


      if (adminCheck.error) {

        console.error(
          "Admin check error:",
          adminCheck.error
        );

        await supabaseClient.auth.signOut();

        showLoginMessage(
          "Admin check failed: " +
          adminCheck.error.message,
          "error"
        );

        return;

      }


      if (!adminCheck.data) {

        await supabaseClient.auth.signOut();

        showLoginMessage(
          "This account is not registered as a NEX BOX administrator.",
          "error"
        );

        return;

      }


      showLoginMessage(
        "Welcome to NEX BOX Admin.",
        "success"
      );


      setTimeout(function() {

        loginPage.classList.add("hidden");

        adminPage.classList.remove("hidden");

        loadMovies();

      }, 500);


    } catch (error) {

      console.error(
        "Unexpected login error:",
        error
      );

      showLoginMessage(
        "Unexpected error: " +
        (error.message || error),
        "error"
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent = "SIGN IN";

    }

  });


  /*
   * LOGOUT
   */

  logoutButton.addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      adminPage.classList.add("hidden");

      loginPage.classList.remove("hidden");

      document.getElementById("password").value = "";

      clearLoginMessage();

    }
  );


  /*
   * CHECK EXISTING SESSION
   */

  async function checkSession() {

    try {

      const result =
        await supabaseClient.auth.getSession();

      if (
        result.data &&
        result.data.session &&
        result.data.session.user
      ) {

        const user =
          result.data.session.user;


        const adminCheck =
          await supabaseClient
            .from("admin_users")
            .select("user_id")
            .eq("user_id", user.id)
            .maybeSingle();


        if (
          !adminCheck.error &&
          adminCheck.data
        ) {

          loginPage.classList.add("hidden");

          adminPage.classList.remove("hidden");

          loadMovies();

        }

      }

    } catch (error) {

      console.error(
        "Session check error:",
        error
      );

    }

  }


  /*
   * ADD MOVIE
   */

  addMovieButton.addEventListener(
    "click",
    async function() {

      movieStatus.className = "status";

      const title =
        document.getElementById("movieTitle")
        .value
        .trim();

      const description =
        document.getElementById("movieDescription")
        .value
        .trim();

      const genre =
        document.getElementById("movieGenre")
        .value
        .trim();

      const yearValue =
        document.getElementById("movieYear")
        .value;

      const downloadable =
        document.getElementById("downloadable")
        .value === "true";

      const posterFile =
        document.getElementById("posterFile")
        .files[0];

      const videoFile =
        document.getElementById("videoFile")
        .files[0];


      if (!title) {

        showMovieStatus(
          "Enter the movie title.",
          "error"
        );

        return;

      }


      if (!posterFile) {

        showMovieStatus(
          "Select a movie poster.",
          "error"
        );

        return;

      }


      if (!videoFile) {

        showMovieStatus(
          "Select a movie video.",
          "error"
        );

        return;

      }


      addMovieButton.disabled = true;

      addMovieButton.textContent =
        "UPLOADING...";


      try {

        /*
         * POSTER
         */

        const posterPath =
          Date.now() +
          "_" +
          cleanFileName(posterFile.name);


        const posterUpload =
          await supabaseClient
            .storage
            .from("Posters")
            .upload(
              posterPath,
              posterFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (posterUpload.error) {

          throw new Error(
            "Poster upload failed: " +
            posterUpload.error.message
          );

        }


        const posterUrl =
          supabaseClient
            .storage
            .from("Posters")
            .getPublicUrl(
              posterPath
            )
            .data
            .publicUrl;


        /*
         * VIDEO
         */

        addMovieButton.textContent =
          "UPLOADING VIDEO...";


        const videoPath =
          Date.now() +
          "_" +
          cleanFileName(videoFile.name);


        const videoUpload =
          await supabaseClient
            .storage
            .from("Videos")
            .upload(
              videoPath,
              videoFile,
              {
                cacheControl: "3600",
                upsert: false
              }
            );


        if (videoUpload.error) {

          throw new Error(
            "Video upload failed: " +
            videoUpload.error.message
          );

        }


        const videoUrl =
          supabaseClient
            .storage
            .from("Videos")
            .getPublicUrl(
              videoPath
            )
            .data
            .publicUrl;


        /*
         * DATABASE
         */

        addMovieButton.textContent =
          "SAVING MOVIE...";


        const movieInsert =
          await supabaseClient
            .from("movies")
            .insert({
              title: title,
              description: description || null,
              genre: genre || null,
              year: yearValue
                ? Number(yearValue)
                : null,
              poster_url: posterUrl,
              video_url: videoUrl,
              downloadable: downloadable
            })
            .select()
            .single();


        if (movieInsert.error) {

          throw new Error(
            "Database error: " +
            movieInsert.error.message
          );

        }


        showMovieStatus(
          "Movie added successfully!",
          "success"
        );


        /*
         * CLEAR FORM
         */

        document.getElementById("movieTitle").value = "";

        document.getElementById("movieDescription").value = "";

        document.getElementById("movieGenre").value = "";

        document.getElementById("movieYear").value = "";

        document.getElementById("posterFile").value = "";

        document.getElementById("videoFile").value = "";


        loadMovies();


      } catch (error) {

        console.error(
          "Add movie error:",
          error
        );

        showMovieStatus(
          error.message ||
          "Failed to add movie.",
          "error"
        );

      } finally {

        addMovieButton.disabled = false;

        addMovieButton.textContent =
          "ADD MOVIE";

      }

    }
  );


  /*
   * CLEAN FILE NAME
   */

  function cleanFileName(name) {

    return name
      .replace(/[^a-zA-Z0-9._-]/g, "_");

  }


  /*
   * LOAD MOVIES
   */

  async function loadMovies() {

    movieList.innerHTML =
      '<div class="empty">Loading movies...</div>';


    try {

      const result =
        await supabaseClient
          .from("movies")
          .select("*")
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (result.error) {

        movieList.innerHTML =
          '<div class="empty">' +
          escapeHtml(result.error.message) +
          "</div>";

        return;

      }


      const movies =
        result.data || [];


      if (!movies.length) {

        movieList.innerHTML =
          '<div class="empty">' +
          "No movies have been added yet." +
          "</div>";

        return;

      }


      movieList.innerHTML =
        movies
          .map(function(movie) {

            return `
              <div class="movie-item">

                <img
                  class="movie-poster"
                  src="${escapeAttribute(movie.poster_url || "")}"
                  alt=""
                  onerror="this.style.display='none'"
                >

                <div class="movie-info">

                  <div class="movie-title">
                    ${escapeHtml(movie.title || "Untitled")}
                  </div>

                  <div class="movie-meta">
                    Genre:
                    ${escapeHtml(movie.genre || "Not set")}
                    <br>

                    Year:
                    ${escapeHtml(
                      movie.year
                        ? String(movie.year)
                        : "Not set"
                    )}
                    <br>

                    Download:
                    ${movie.downloadable ? "Yes" : "No"}
                  </div>

                </div>

              </div>
            `;

          })
          .join("");


    } catch (error) {

      console.error(
        "Load movies error:",
        error
      );

      movieList.innerHTML =
        '<div class="empty">' +
        escapeHtml(
          error.message ||
          "Could not load movies."
        ) +
        "</div>";

    }

  }


  /*
   * BASIC HTML SAFETY
   */

  function escapeHtml(value) {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  /*
   * START
   */

  checkSession();

</script>

</body>
</html>
