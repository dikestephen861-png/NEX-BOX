<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEX BOX Player</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#050505;
 color:white;
 font-family:Arial,sans-serif
}

.top{
 height:58px;
 display:flex;
 align-items:center;
 gap:12px;
 padding:0 12px;
 background:#090909;
 border-bottom:1px solid #222
}

.back{
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#181818;
 color:white;
 font-size:25px
}

.logo{
 font-size:21px;
 font-weight:900
}

.logo span{color:#e50914}

.player{
 width:100%;
 background:#000;
 position:relative
}

video{
 width:100%;
 display:block;
 background:#000;
 max-height:75vh
}

.loading{
 padding:25px;
 text-align:center;
 color:#aaa
}

.error{
 display:none;
 padding:35px 20px;
 text-align:center;
 color:#aaa
}

.error h2{
 color:white
}

.retry{
 background:#e50914;
 color:white;
 border:0;
 border-radius:8px;
 padding:12px 20px;
 font-weight:bold
}

.info{
 padding:18px 15px 30px
}

h1{
 margin:0 0 8px;
 font-size:23px
}

.meta{
 color:#888;
 font-size:12px;
 margin-bottom:15px
}

.desc{
 color:#aaa;
 line-height:1.6;
 font-size:14px
}

.buttons{
 display:flex;
 flex-wrap:wrap;
 gap:9px;
 margin-top:18px
}

button.action{
 background:#181818;
 border:1px solid #292929;
 color:white;
 border-radius:8px;
 padding:11px 15px;
 font-weight:bold
}

button.play{
 background:#e50914;
 border-color:#e50914
}

.status{
 margin-top:15px;
 color:#777;
 font-size:12px;
 word-break:break-all
}
</style>
</head>

<body>

<div class="top">
 <button class="back" onclick="history.back()">‹</button>
 <div class="logo">NEX <span>BOX</span></div>
</div>

<div class="player">

 <video
  id="video"
  controls
  playsinline
  preload="metadata">
 </video>

 <div id="loading" class="loading">
  Loading movie...
 </div>

 <div id="error" class="error">
  <h2>Movie could not be played</h2>
  <p id="errorText">
   The video could not be loaded.
  </p>
  <button class="retry" onclick="loadMovie()">
   Try Again
  </button>
 </div>

</div>

<div class="info">

 <h1 id="title">Loading...</h1>

 <div class="meta" id="meta"></div>

 <div class="desc" id="description"></div>

 <div class="buttons">

  <button class="action play" onclick="playVideo()">
   ▶ Play
  </button>

  <button class="action" onclick="shareMovie()">
   ↗ Share
  </button>

  <button class="action" onclick="downloadMovie()">
   ↓ Download
  </button>

 </div>

 <div id="status" class="status"></div>

</div>

<script>

const SUPABASE_URL=
 "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY=
 "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db=
 window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
 );

const video=
 document.getElementById("video");

let movie=null;
let videoURL="";


async function loadMovie(){

 document.getElementById("loading")
  .style.display="block";

 document.getElementById("error")
  .style.display="none";

 const params=
  new URLSearchParams(
   window.location.search
  );

 /*
  FIRST: try the movie JSON
 */

 const movieParam=
  params.get("movie");

 if(movieParam){

  try{

   movie=
    JSON.parse(
     decodeURIComponent(movieParam)
    );

  }catch(e){

   console.log(
    "Movie parameter could not be decoded"
   );
  }
 }


 /*
  SECOND: if JSON failed, get ID
 */

 if(!movie){

  const id=params.get("id");

  if(id){

   try{

    const result=
     await db
      .from("movies")
      .select("*")
      .eq("id",id)
      .single();

    if(result.error)
     throw result.error;

    movie=result.data;

   }catch(error){

    showError(
     "Could not find this movie in the NEX BOX database."
    );

    return;
   }
  }
 }


 if(!movie){

  showError(
   "No movie was selected."
  );

  return;
 }


 /*
  SHOW MOVIE INFORMATION
 */

 document.getElementById("title")
  .textContent=
   movie.title ||
   "NEX BOX Movie";

 document.getElementById("meta")
  .textContent=
   [
    movie.year,
    movie.genre
   ]
   .filter(Boolean)
   .join(" • ");

 document.getElementById("description")
  .textContent=
   movie.description ||
   "No description available.";


 /*
  GET VIDEO URL
 */

 videoURL=
  movie.video_url || "";


 if(!videoURL){

  showError(
   "This movie does not have a video URL."
  );

  return;
 }


 console.log(
  "NEX BOX PLAYING:",
  videoURL
 );

 document.getElementById("status")
  .textContent=
   "Video source found.";


 /*
  LOAD VIDEO
 */

 video.pause();

 video.removeAttribute("src");

 video.load();

 video.src=videoURL;

 video.load();


 video.onloadedmetadata=()=>{

  document.getElementById("loading")
   .style.display="none";

  document.getElementById("status")
   .textContent=
    "Video ready — press Play.";

 };


 video.oncanplay=()=>{

  document.getElementById("loading")
   .style.display="none";

 };


 video.onerror=()=>{

  console.error(
   "HTML VIDEO ERROR",
   video.error
  );

  showError(
   "The video URL was found, but your browser could not play the video. The source must be a direct video file such as MP4."
  );

 };

}


function playVideo(){

 if(!videoURL){

  showError(
   "No video source is available."
  );

  return;
 }

 video.play()
  .catch(error=>{

   console.log(
    "Browser play response:",
    error
   );

  });

}


async function shareMovie(){

 try{

  if(navigator.share){

   await navigator.share({
    title:movie?.title || "NEX BOX",
    text:
     "Watch this movie on NEX BOX",
    url:window.location.href
   });

  }else{

   await navigator.clipboard.writeText(
    window.location.href
   );

   document.getElementById("status")
    .textContent=
     "Movie link copied.";

  }

 }catch(e){}
}


function downloadMovie(){

 if(!videoURL){

  document.getElementById("status")
   .textContent=
    "No downloadable video.";

  return;
 }

 const a=
  document.createElement("a");

 a.href=videoURL;

 a.target="_blank";

 a.rel="noopener";

 a.download=
  (movie?.title || "NEX BOX Movie")
   .replace(/[^a-z0-9]/gi,"_")+
   ".mp4";

 document.body.appendChild(a);

 a.click();

 a.remove();

 document.getElementById("status")
  .textContent=
   "Download requested.";

}


function showError(message){

 document.getElementById("loading")
  .style.display="none";

 document.getElementById("error")
  .style.display="block";

 document.getElementById("errorText")
  .textContent=message;

}


loadMovie();

</script>

</body>
  </html>
