<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">
<title>NEX BOX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#08090c;
  color:#fff;
  font-family:Arial,sans-serif;
  padding-bottom:30px
}
.topbar{
  height:58px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  background:#08090c;
  border-bottom:1px solid #20232b;
}
.back{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#171a21;
  color:#fff;
  font-size:25px;
}
.logo{
  font-size:20px;
  font-weight:900;
  letter-spacing:1.5px
}
.logo span{color:#e50914}
.player{
  width:100%;
  background:#000
}
video{
  width:100%;
  display:block;
  max-height:75vh;
  background:#000
}
.content{
  padding:18px 15px;
  max-width:900px;
  margin:auto
}
.title{
  font-size:24px;
  font-weight:900
}
.meta{
  margin-top:7px;
  color:#8f949f;
  font-size:12px
}
.description{
  margin-top:15px;
  color:#c7c9ce;
  font-size:14px;
  line-height:1.6
}
.actions{
  display:flex;
  gap:8px;
  margin-top:18px
}
.action{
  flex:1;
  min-height:46px;
  border:1px solid #292c34;
  border-radius:10px;
  background:#171a21;
  color:#fff;
  font-weight:700;
  cursor:pointer
}
.action.active{
  background:#e50914;
  border-color:#e50914
}
.poster{
  width:100px;
  margin-top:20px;
  border-radius:8px
}
.loading,
.error{
  text-align:center;
  padding:80px 20px;
  color:#999
}
</style>
</head>

<body>

<header class="topbar">
<button class="back" onclick="history.back()">‹</button>
<div class="logo">NEX<span>BOX</span></div>
</header>

<div id="loading" class="loading">
Loading movie...
</div>

<div id="app" style="display:none">

<div class="player">
<video id="video" controls playsinline></video>
</div>

<main class="content">

<h1 id="title" class="title"></h1>

<div id="meta" class="meta"></div>

<div class="actions">

<button id="myListBtn"
class="action"
onclick="toggleMyList()">
❤️ My List
</button>

<button class="action"
onclick="shareMovie()">
↗ Share
</button>

<button id="downloadBtn"
class="action"
onclick="downloadMovie()"
style="display:none">
↓ Download
</button>

</div>

<p id="description" class="description"></p>

<img id="poster" class="poster">

</main>
</div>

<div id="error" class="error" style="display:none">
Movie could not be loaded.
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

const movieId =
new URLSearchParams(
location.search
).get("movie");

let movie=null;

function getList(){

try{

return JSON.parse(
localStorage.getItem("nexbox_my_list") || "[]"
);

}catch(e){

return [];

}

}

function setList(list){

localStorage.setItem(
"nexbox_my_list",
JSON.stringify(list)
);

}

function updateButton(){

const button=
document.getElementById("myListBtn");

const list=getList();

const exists=list.some(
item=>String(item.id)===String(movie.id)
);

if(exists){

button.textContent="✓ In My List";
button.classList.add("active");

}else{

button.textContent="❤️ My List";
button.classList.remove("active");

}

}

function toggleMyList(){

if(!movie){

alert("Movie is still loading.");

return;

}

let list=getList();

const index=list.findIndex(
item=>String(item.id)===String(movie.id)
);

if(index>=0){

list.splice(index,1);

}else{

list.push({

id:movie.id,

title:movie.title || "",

poster_url:movie.poster_url || "",

year:movie.year || "",

genre:movie.genre || "",

description:movie.description || "",

video_url:movie.video_url || "",

downloadable:movie.downloadable === true

});

}

setList(list);

updateButton();

}

function shareMovie(){

const url=location.href;

if(navigator.share){

navigator.share({

title:movie.title,

text:"Watch this movie on NEX BOX",

url:url

});

}else{

navigator.clipboard.writeText(url);

alert("Movie link copied!");

}

}

function downloadMovie(){

if(!movie.video_url){

alert("Download link unavailable.");

return;

}

const link=document.createElement("a");

link.href=movie.video_url;

link.download=
(movie.title || "NEX BOX Movie")+".mp4";

document.body.appendChild(link);

link.click();

link.remove();

}

async function loadMovie(){

if(!movieId){

document.getElementById("loading").style.display="none";

document.getElementById("error").style.display="block";

return;

}

const result=
await db
.from("movies")
.select("*")
.eq("id",movieId)
.maybeSingle();

if(result.error || !result.data){

console.error(result.error);

document.getElementById("loading").style.display="none";

document.getElementById("error").style.display="block";

return;

}

movie=result.data;

document.getElementById("loading").style.display="none";

document.getElementById("app").style.display="block";

document.getElementById("title").textContent=
movie.title || "Untitled Movie";

document.getElementById("meta").textContent=
[movie.year,movie.genre]
.filter(Boolean)
.join(" • ");

document.getElementById("description").textContent=
movie.description || "";

if(movie.poster_url){

document.getElementById("poster").src=
movie.poster_url;

}

if(movie.video_url){

document.getElementById("video").src=
movie.video_url;

}

if(movie.downloadable===true){

document.getElementById("downloadBtn").style.display=
"block";

}

updateButton();

}

loadMovie();

</script>

</body>
</html>
