<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEX BOX Movies</title>

  <meta name="theme-color" content="#08090c">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #08090c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
    }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #1d1f25;
      background: #08090c;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .back {
      color: #fff;
      text-decoration: none;
      font-size: 25px;
      margin-right: 15px;
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .poster {
      width: 100%;
      max-height: 480px;
      object-fit: cover;
      border-radius: 14px;
      display: block;
      background: #15171d;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin-top: 20px;
    }

    .meta {
      margin-top: 10px;
      color: #a8abb4;
      font-size: 14px;
    }

    .description {
      color: #c9cbd1;
      line-height: 1.6;
      margin-top: 16px;
      font-size: 15px;
    }

    .player {
      width: 100%;
      margin-top: 20px;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
    }

    video {
      width: 100%;
      display: block;
      background: #000;
    }

    .buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    button,
    .button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      background: #20232b;
      color: white;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    button:hover,
    .button:hover {
      background: #30343e;
    }

    .primary {
      background: #e50914;
    }

    .primary:hover {
      background: #f01823;
    }

    .message {
      text-align: center;
      padding: 70px 20px;
      color: #aaa;
    }

    .error {
      color: #ff6972;
    }

    .loading {
      color: #aaa;
    }
  </style>
</head>

<body>

  <header class="topbar">
    <a class="back" href="./index.html">‹</a>
    <div class="brand">NEX BOX MOVIES</div>
  </header>

  <main class="container">

    <div id="loading" class="message loading">
      Loading movie...
    </div>

    <div id="movieContent" style="display:none;">

      <img id="poster" class="poster" src="" alt="Movie poster">

      <h1 id="title" class="title"></h1>

      <div id="meta" class="meta"></div>

      <div class="player">
        <video id="video" controls playsinline preload="metadata">
          Your browser does not support video playback.
        </video>
      </div>

      <div class="buttons">
        <button id="listButton" class="primary">
          ＋ My List
        </button>

        <button id="shareButton">
          Share
        </button>

        <a id="downloadButton"
           class="button"
           href="#"
           download
           style="display:none;">
          Download
        </a>
      </div>

      <p id="description" class="description"></p>

    </div>

    <div id="error" class="message error" style="display:none;"></div>

  </main>

<script>
const SUPABASE_URL =
  "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const params = new URLSearchParams(window.location.search);
const movieId = params.get("movie");

const loading = document.getElementById("loading");
const content = document.getElementById("movieContent");
const errorBox = document.getElementById("error");

const poster = document.getElementById("poster");
const title = document.getElementById("title");
const meta = document.getElementById("meta");
const description = document.getElementById("description");
const video = document.getElementById("video");

const listButton = document.getElementById("listButton");
const shareButton = document.getElementById("shareButton");
const downloadButton = document.getElementById("downloadButton");

let currentMovie = null;

function showError(message) {
  loading.style.display = "none";
  content.style.display = "none";
  errorBox.style.display = "block";
  errorBox.textContent = message;
}

function getSavedMovies() {
  try {
    return JSON.parse(
      localStorage.getItem("nexbox_my_list") || "[]"
    );
  } catch {
    return [];
  }
}

function saveMovies(list) {
  localStorage.setItem(
    "nexbox_my_list",
    JSON.stringify(list)
  );
}

function updateListButton() {
  if (!currentMovie) return;

  const list = getSavedMovies();

  const exists = list.some(
    movie => movie.id === currentMovie.id
  );

  listButton.textContent =
    exists ? "✓ In My List" : "＋ My List";
}

listButton.addEventListener("click", () => {

  if (!currentMovie) return;

  let list = getSavedMovies();

  const exists = list.some(
    movie => movie.id === currentMovie.id
  );

  if (exists) {
    list = list.filter(
      movie => movie.id !== currentMovie.id
    );
  } else {
    list.push(currentMovie);
  }

  saveMovies(list);
  updateListButton();
});

shareButton.addEventListener("click", async () => {

  try {

    await navigator.clipboard.writeText(
      window.location.href
    );

    shareButton.textContent = "Link Copied";

    setTimeout(() => {
      shareButton.textContent = "Share";
    }, 2000);

  } catch {

    alert("Copy this page link to share the movie.");
  }
});

async function loadMovie() {

  if (!movieId) {
    showError("Movie ID is missing.");
    return;
  }

  try {

    const { data, error } = await db
      .from("movies")
      .select("*")
      .eq("id", movieId)
      .maybeSingle();

    if (error) {
      console.error(error);
      showError("Unable to load this movie.");
      return;
    }

    if (!data) {
      showError("Movie not found.");
      return;
    }

    currentMovie = data;

    title.textContent =
      data.title || "Untitled Movie";

    description.textContent =
      data.description || "No description available.";

    poster.src =
      data.poster_url ||
      "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba";

    const information = [];

    if (data.genre) {
      information.push(data.genre);
    }

    if (data.year) {
      information.push(data.year);
    }

    meta.textContent =
      information.join(" • ");

    if (data.video_url) {
      video.src = data.video_url;
    }

    if (
      data.downloadable === true &&
      data.video_url
    ) {

      downloadButton.href = data.video_url;
      downloadButton.style.display = "inline-block";

    }

    updateListButton();

    loading.style.display = "none";
    content.style.display = "block";

  } catch (err) {

    console.error(err);

    showError(
      "Something went wrong while loading the movie."
    );
  }
}

loadMovie();
</script>

</body>
  </html>
