<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <title>NEX BOX</title>

  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    .watch-page {
      padding-bottom: 100px;
    }

    .player {
      width: 100%;
      background: #000;
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    .content {
      padding: 18px;
    }

    .title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .description {
      color: #ccc;
      line-height: 1.6;
      font-size: 14px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 20px 0;
    }

    .action-btn {
      border: 0;
      border-radius: 9px;
      padding: 13px 10px;
      background: #1b1b1b;
      color: white;
      font-weight: bold;
    }

    .action-btn.active {
      background: white;
      color: black;
    }

    .back {
      display: inline-block;
      margin: 15px;
      color: white;
      text-decoration: none;
    }

    .status {
      text-align: center;
      color: #aaa;
      padding: 50px 20px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(10,10,10,.97);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .bottom-nav a {
      color: #999;
      text-decoration: none;
      font-size: 11px;
      text-align: center;
    }

    .bottom-nav span {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    .bottom-nav .active {
      color: white;
    }
  </style>
</head>

<body>

<div class="watch-page">

  <a href="./index.html" class="back">← Back</a>

  <div id="loading" class="status">
    Loading movie...
  </div>

  <div id="movieArea" style="display:none;">

    <div class="player">
      <video id="videoPlayer" controls playsinline></video>
    </div>

    <div class="content">

      <div id="movieTitle" class="title"></div>

      <div id="movieMeta" class="meta"></div>

      <div class="actions">

        <button id="listBtn" class="action-btn" onclick="toggleMyList()">
          ♡ My List
        </button>

        <button class="action-btn" onclick="shareMovie()">
          ↗ Share
        </button>

      </div>

      <div id="movieDescription" class="description"></div>

    </div>

  </div>

</div>

<nav class="bottom-nav">

  <a href="./index.html">
    <span>⌂</span>
    Home
  </a>

  <a href="./index.html#movies">
    <span>🎬</span>
    Movies
  </a>

  <a href="./library.html" class="active">
    <span>♡</span>
    My List
  </a>

</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let movie = null;

/* --------------------------------
   DEVICE ID
-------------------------------- */

function getDeviceId() {

  let id = localStorage.getItem("nexbox_device_id");

  if (!id) {

    id =
      crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString(36) +
          Math.random().toString(36).slice(2);

    localStorage.setItem(
      "nexbox_device_id",
      id
    );
  }

  return id;
}


/* --------------------------------
   LOAD MOVIE
-------------------------------- */

async function loadMovie() {

  const params =
    new URLSearchParams(location.search);

  const movieId =
    params.get("movie");

  if (!movieId) {

    document.getElementById("loading").innerHTML =
      "Movie could not be loaded.";

    return;
  }

  const { data, error } =
    await db
      .from("movies")
      .select("*")
      .eq("id", movieId)
      .maybeSingle();

  if (error || !data) {

    console.error(error);

    document.getElementById("loading").innerHTML =
      "Movie could not be loaded.";

    return;
  }

  movie = data;

  document.getElementById("loading").style.display =
    "none";

  document.getElementById("movieArea").style.display =
    "block";

  document.getElementById("movieTitle").textContent =
    movie.title || "Untitled Movie";

  document.getElementById("movieMeta").textContent =
    [movie.year, movie.genre]
      .filter(Boolean)
      .join(" • ");

  document.getElementById("movieDescription").textContent =
    movie.description || "No description available.";

  const video =
    document.getElementById("videoPlayer");

  video.src = movie.video_url;

  await checkMyList();
}


/* --------------------------------
   CHECK MY LIST
-------------------------------- */

async function checkMyList() {

  if (!movie) return;

  const deviceId =
    getDeviceId();

  const { data, error } =
    await db
      .from("nexbox_my_list")
      .select("id")
      .eq("device_id", deviceId)
      .eq("movie_id", String(movie.id))
      .maybeSingle();

  if (error) {

    console.error(
      "My List check error:",
      error
    );

    return;
  }

  updateButton(!!data);
}


/* --------------------------------
   UPDATE BUTTON
-------------------------------- */

function updateButton(saved) {

  const button =
    document.getElementById("listBtn");

  if (saved) {

    button.textContent =
      "✓ In My List";

    button.classList.add("active");

  } else {

    button.textContent =
      "♡ My List";

    button.classList.remove("active");

  }
}


/* --------------------------------
   ADD / REMOVE
-------------------------------- */

async function toggleMyList() {

  if (!movie) return;

  const deviceId =
    getDeviceId();

  const button =
    document.getElementById("listBtn");

  button.disabled = true;

  try {

    const { data: existing, error } =
      await db
        .from("nexbox_my_list")
        .select("id")
        .eq("device_id", deviceId)
        .eq("movie_id", String(movie.id))
        .maybeSingle();

    if (error) {
      throw error;
    }

    if (existing) {

      const { error: deleteError } =
        await db
          .from("nexbox_my_list")
          .delete()
          .eq("id", existing.id);

      if (deleteError) {
        throw deleteError;
      }

      updateButton(false);

    } else {

      const { error: insertError } =
        await db
          .from("nexbox_my_list")
          .insert({

            device_id: deviceId,

            movie_id: String(movie.id),

            movie_data: movie

          });

      if (insertError) {
        throw insertError;
      }

      updateButton(true);
    }

  } catch (error) {

    console.error(
      "My List error:",
      error
    );

    alert(
      "Could not update My List. Please try again."
    );

  } finally {

    button.disabled = false;

  }
}


/* --------------------------------
   SHARE
-------------------------------- */

async function shareMovie() {

  const url =
    location.href;

  try {

    if (navigator.share) {

      await navigator.share({

        title: movie.title,

        text:
          "Watch " +
          movie.title +
          " on NEX BOX",

        url: url

      });

    } else {

      await navigator.clipboard.writeText(url);

      alert("Movie link copied.");

    }

  } catch (error) {

    console.log(error);

  }
}


loadMovie();

</script>

</body>
        </html>
