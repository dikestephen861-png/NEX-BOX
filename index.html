<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<meta name="theme-color" content="#080808">

<title>NEX BOX - Watch Movies</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080808;
color:#fff;
font-family:Arial,sans-serif;
padding-bottom:80px;
}

header{
position:sticky;
top:0;
z-index:1000;
background:#111;
border-bottom:1px solid #292929;
padding:15px;
}

.header{
max-width:1200px;
margin:auto;
display:flex;
align-items:center;
gap:20px;
}

.logo{
font-size:25px;
font-weight:bold;
letter-spacing:2px;
white-space:nowrap;
}

.logo span{
color:#e50914;
}

.search{
flex:1;
}

.search input{
width:100%;
padding:12px 16px;
background:#202020;
border:1px solid #333;
border-radius:25px;
color:white;
outline:none;
font-size:15px;
}

.container{
max-width:1200px;
margin:auto;
padding:20px;
}

.hero{
min-height:320px;
border-radius:15px;
background:
linear-gradient(90deg,#080808 10%,rgba(8,8,8,.75),rgba(8,8,8,.2)),
url("https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1400&q=80")
center/cover;
display:flex;
align-items:end;
padding:30px;
margin-bottom:30px;
}

.hero-content{
max-width:600px;
}

.hero h1{
font-size:42px;
margin:0 0 10px;
}

.hero p{
color:#ccc;
line-height:1.6;
}

.hero-button{
display:inline-block;
background:#e50914;
color:#fff;
padding:13px 22px;
border-radius:6px;
text-decoration:none;
font-weight:bold;
margin-top:10px;
}

.categories{
display:flex;
gap:10px;
overflow-x:auto;
padding-bottom:15px;
}

.category{
background:#181818;
color:#ccc;
border:1px solid #333;
padding:9px 16px;
border-radius:20px;
white-space:nowrap;
cursor:pointer;
}

.category.active,
.category:hover{
background:#e50914;
color:#fff;
border-color:#e50914;
}

.section-title{
margin-top:25px;
margin-bottom:15px;
}

.movies{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(150px,1fr));
gap:15px;
}

.movie{
background:#141414;
border-radius:9px;
overflow:hidden;
cursor:pointer;
transition:.2s;
}

.movie:hover{
transform:translateY(-4px);
}

.poster{
width:100%;
height:220px;
background:#222;
}

.poster img{
width:100%;
height:100%;
object-fit:cover;
}

.movie-info{
padding:10px;
}

.movie-title{
font-weight:bold;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.movie-meta{
font-size:12px;
color:#888;
margin-top:6px;
}

.loading{
text-align:center;
padding:50px;
color:#888;
}

.empty{
padding:40px;
text-align:center;
color:#888;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
height:65px;
background:#111;
border-top:1px solid #292929;
display:flex;
justify-content:space-around;
align-items:center;
z-index:2000;
}

.bottom-nav button{
background:none;
border:0;
color:#aaa;
font-size:20px;
cursor:pointer;
}

.bottom-nav span{
display:block;
font-size:11px;
margin-top:3px;
}

@media(max-width:600px){

.header{
gap:10px;
}

.logo{
font-size:20px;
}

.hero{
min-height:300px;
padding:20px;
}

.hero h1{
font-size:30px;
}

.movies{
grid-template-columns:
repeat(2,1fr);
}

.poster{
height:230px;
}

}

</style>

</head>


<body>


<header>

<div class="header">

<div class="logo">
NEX<span>BOX</span>
</div>

<div class="search">

<input
id="searchBox"
type="search"
placeholder="Search movies..."
autocomplete="off">

</div>

</div>

</header>


<main class="container">


<section class="hero">

<div class="hero-content">

<h1>Watch Movies</h1>

<p>
Discover movies and watch authorized
full-length content on NEX BOX.
</p>

<a
href="#movies"
class="hero-button">

▶ Browse Movies

</a>

</div>

</section>


<div class="categories">

<button
class="category active"
onclick="filterCategory('All',this)">
All
</button>

<button
class="category"
onclick="filterCategory('Action',this)">
Action
</button>

<button
class="category"
onclick="filterCategory('Comedy',this)">
Comedy
</button>

<button
class="category"
onclick="filterCategory('Drama',this)">
Drama
</button>

<button
class="category"
onclick="filterCategory('Animation',this)">
Animation
</button>

<button
class="category"
onclick="filterCategory('Adventure',this)">
Adventure
</button>

</div>


<h2
class="section-title"
id="movies">

Latest Movies

</h2>


<div
class="movies"
id="movieList">

<div class="loading">
Loading movies...
</div>

</div>


</main>


<nav class="bottom-nav"><button
class="admin-button"
onclick="openAdmin()">

⚙️

<span>
Admin
</span>

</button>

<button onclick="goHome()">
🏠
<span>Home</span>
</button>

<button onclick="goMovies()">
🎬
<span>Movies</span>
</button>

<button onclick="focusSearch()">
🔎
<span>Search</span>
</button>

</nav>


<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const supabaseClient =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let movies = [];


async function loadMovies(){

const {data,error} =
await supabaseClient
.from("movies")
.select("*")
.order("created_at",{ascending:false});


if(error){

console.error(error);

document.getElementById("movieList").innerHTML =
"<div class='empty'>Unable to load movies.</div>";

return;

}

movies=data || [];

displayMovies(movies);

}


function displayMovies(list){

const movieList =
document.getElementById("movieList");

movieList.innerHTML="";


if(!list.length){

movieList.innerHTML =
"<div class='empty'>No movies found.</div>";

return;

}


list.forEach(movie=>{

const card =
document.createElement("div");

card.className="movie";


card.innerHTML=`

<div class="poster">

<img
src="${movie.poster_url || ''}"
alt="${escapeHtml(movie.title)}"
loading="lazy">

</div>

<div class="movie-info">

<div class="movie-title">
${escapeHtml(movie.title)}
</div>

<div class="movie-meta">
${movie.year || ""} • ${escapeHtml(movie.genre || "")}
</div>

</div>

`;


card.onclick=()=>{

window.location.href =
"./movie.html?id="+movie.id;

};


movieList.appendChild(card);

});

}


function filterCategory(category,button){

document
.querySelectorAll(".category")
.forEach(btn=>{
btn.classList.remove("active");
});


button.classList.add("active");


if(category==="All"){

displayMovies(movies);

return;

}


const filtered =
movies.filter(movie=>
(movie.genre || "").toLowerCase()
===
category.toLowerCase()
);

displayMovies(filtered);

}


document
.getElementById("searchBox")
.addEventListener("input",function(){

const search =
this.value.toLowerCase().trim();

const filtered =
movies.filter(movie=>
(movie.title || "")
.toLowerCase()
.includes(search)
);

displayMovies(filtered);

});


function focusSearch(){

document
.getElementById("searchBox")
.focus();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function goHome(){

window.scrollTo({
top:0,
behavior:"smooth"
});

}


function goMovies(){

document
.getElementById("movies")
.scrollIntoView({
behavior:"smooth"
});

}


function escapeHtml(text){

const div =
document.createElement("div");

div.textContent=text || "";

return div.innerHTML;

}


loadMovies();

</script>


</body>

  </html>
</admin>
