<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">
<title>NEX BOX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#050505 !important;
  color:#fff !important;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow-x:hidden;
}

button,
input{
  font-family:inherit;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:85px;
  background:#050505 !important;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:1000;

  height:62px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  background:#080808 !important;
  border-bottom:1px solid #222;
}

.logo{
  color:#ff1744 !important;
  font-size:24px;
  font-weight:900;
  letter-spacing:-1px;
}

.search-button{
  width:40px;
  height:40px;

  border:0;
  border-radius:50%;

  background:#1b1b1b !important;
  color:#fff !important;

  font-size:18px;
}

/* HERO */

.hero{
  margin:14px;

  min-height:220px;

  border-radius:20px;

  padding:22px;

  display:flex;
  align-items:flex-end;

  background:
    linear-gradient(
      to top,
      #000 0%,
      rgba(0,0,0,.7) 45%,
      rgba(0,0,0,.15) 100%
    ),
    linear-gradient(
      135deg,
      #333,
      #111
    ) !important;

  box-shadow:0 12px 35px rgba(0,0,0,.5);
}

.hero-text{
  width:100%;
}

.hero-small{
  color:#ff1744 !important;
  font-size:11px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

.hero h1{
  color:#fff !important;
  font-size:30px;
  font-weight:900;
}

.hero p{
  color:#aaa !important;
  font-size:13px;
  line-height:1.5;
  margin-top:8px;
}

/* SEARCH */

.search{
  height:50px;

  margin:15px 14px;

  display:flex;
  align-items:center;

  padding:0 14px;

  background:#171717 !important;

  border:1px solid #292929;
  border-radius:14px;
}

.search span{
  color:#777 !important;
  font-size:18px;
  margin-right:8px;
}

#search{
  width:100%;
  height:100%;

  border:0;
  outline:0;

  background:transparent !important;
  color:#fff !important;

  font-size:14px;
}

#search::placeholder{
  color:#777 !important;
}

/* SECTIONS */

.section{
  margin:25px 14px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:12px;
}

.section-title{
  color:#fff !important;
  font-size:18px;
  font-weight:900;
}

.section-count{
  color:#777 !important;
  font-size:11px;
}

/* MOVIES */

.grid{
  display:grid;

  grid-template-columns:repeat(2,minmax(0,1fr));

  gap:12px;
}

/* CARD */

.card{
  overflow:hidden;

  background:#141414 !important;

  border:1px solid #282828;
  border-radius:15px;

  box-shadow:0 8px 25px rgba(0,0,0,.4);
}

.card:active{
  transform:scale(.97);
}

/* POSTER */

.poster{
  position:relative;

  width:100%;
  height:220px;

  background:#222 !important;
}

.poster img{
  width:100%;
  height:100%;

  display:block;

  object-fit:cover;
}

.poster-placeholder{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(135deg,#292929,#111);

  color:#666;
  font-weight:800;
}

/* PLAY */

.play{
  position:absolute;

  right:9px;
  bottom:9px;

  width:38px;
  height:38px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:#ff1744 !important;
  color:#fff !important;

  box-shadow:0 5px 15px rgba(0,0,0,.5);
}

/* INFO */

.info{
  padding:10px;

  background:#141414 !important;
}

.title{
  color:#fff !important;

  font-size:14px;
  font-weight:800;
  line-height:1.3;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  overflow:hidden;
}

.meta{
  display:flex;
  gap:7px;

  margin-top:6px;

  color:#888 !important;

  font-size:10px;
}

.description{
  margin-top:6px;

  color:#999 !important;

  font-size:10px;
  line-height:1.4;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  overflow:hidden;
}

.watch{
  width:100%;

  margin-top:9px;

  padding:9px;

  border:0;
  border-radius:9px;

  background:#ff1744 !important;
  color:#fff !important;

  font-size:12px;
  font-weight:900;
}

/* STATUS */

.status{
  grid-column:1/-1;

  padding:35px 15px;

  text-align:center;

  background:#111 !important;

  border:1px solid #252525;
  border-radius:15px;

  color:#888 !important;

  font-size:13px;
}

.status strong{
  display:block;
  margin-bottom:6px;
  color:#fff !important;
}

.error{
  color:#ff8fa3 !important;
}

/* BOTTOM NAV */

.nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  z-index:2000;

  height:72px;

  display:flex;
  align-items:center;
  justify-content:space-around;

  background:#090909 !important;

  border-top:1px solid #252525;
}

.nav a{
  flex:1;

  height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  gap:4px;

  text-decoration:none;

  color:#777 !important;

  font-size:10px;
  font-weight:700;
}

.nav a.active{
  color:#ff1744 !important;
}

.nav-icon{
  font-size:20px;
}

/* DESKTOP */

@media(min-width:700px){

  #app{
    max-width:1150px;
    margin:auto;
  }

  .grid{
    grid-template-columns:repeat(5,minmax(0,1fr));
  }

  .poster{
    height:280px;
  }

  .hero{
    min-height:330px;
  }

  .nav{
    max-width:1150px;
    left:50%;
    right:auto;
    width:100%;
    transform:translateX(-50%);
  }
}
</style>
</head>

<body>

<div id="app">

  <header class="header">

    <div class="logo">
      NEX BOX
    </div>

    <button
      class="search-button"
      onclick="focusSearch()"
    >
      🔍
    </button>

  </header>


  <section class="hero">

    <div class="hero-text">

      <div class="hero-small">
        NEX BOX
      </div>

      <h1>
        Watch Movies
      </h1>

      <p>
        Discover and watch movies from your NEX BOX library.
      </p>

    </div>

  </section>


  <div class="search">

    <span>🔎</span>

    <input
      id="search"
      type="search"
      placeholder="Search movies..."
    >

  </div>


  <section class="section">

    <div class="section-head">

      <h2 class="section-title">
        NEX BOX MOVIES
      </h2>

      <span
        id="count"
        class="section-count"
      >
        Loading...
      </span>

    </div>

    <div
      id="movies"
      class="grid"
    >

      <div class="status">
        <strong>Loading movies...</strong>
        Connecting to NEX BOX.
      </div>

    </div>

  </section>


  <section class="section">

    <div class="section-head">

      <h2 class="section-title">
        INTERNET ARCHIVE
      </h2>

      <span class="section-count">
        Open content
      </span>

    </div>

    <div
      id="archive"
      class="grid"
    >

      <div class="status">
        Loading archive...
      </div>

    </div>

  </section>

</div>


<nav class="nav">

  <a
    class="active"
    href="./index.html?v=30"
  >
    <span class="nav-icon">⌂</span>
    Home
  </a>

  <a
    href="./movies.html?v=30"
  >
    <span class="nav-icon">🎬</span>
    Movies
  </a>

  <a
    href="./library.html?v=30"
  >
    <span class="nav-icon">♡</span>
    My List
  </a>

</nav>


<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allMovies=[];


/* ESCAPE */

function safe(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* OPEN */

function openMovie(movie){

  const data =
    encodeURIComponent(
      JSON.stringify(movie)
    );

  location.href =
    "./watch.html?movie="+data;

}


/* POSTER */

function poster(movie){

  const url =
    movie.poster_url || "";

  if(!url){

    return `
      <div class="poster-placeholder">
        NEX BOX
      </div>
    `;

  }

  return `
    <img
      src="${safe(url)}"
      alt="${safe(movie.title)}"
      onerror="this.style.display='none'"
    >
  `;

}


/* RENDER */

function render(list){

  const box =
    document.getElementById("movies");

  document.getElementById("count")
    .textContent =
    list.length+
    (list.length===1 ? " movie":" movies");


  if(!list.length){

    box.innerHTML=`
      <div class="status">
        <strong>No movies found</strong>
        Try another search.
      </div>
    `;

    return;

  }


  box.innerHTML =
  list.map((movie,index)=>{

    return `

      <article
        class="card"
        onclick="openMovie(allMovies[${allMovies.indexOf(movie)}])"
      >

        <div class="poster">

          ${poster(movie)}

          <div class="play">
            ▶
          </div>

        </div>

        <div class="info">

          <div class="title">
            ${safe(movie.title)}
          </div>

          <div class="meta">

            <span>
              ${safe(movie.year || "N/A")}
            </span>

            <span>•</span>

            <span>
              ${safe(movie.genre || "Movie")}
            </span>

          </div>

          <div class="description">
            ${safe(
              movie.description ||
              "Watch this movie on NEX BOX."
            )}
          </div>

          <button
            class="watch"
            onclick="event.stopPropagation();openMovie(allMovies[${allMovies.indexOf(movie)}])"
          >
            ▶ WATCH
          </button>

        </div>

      </article>

    `;

  }).join("");

}


/* LOAD SUPABASE */

async function loadMovies(){

  const box =
    document.getElementById("movies");


  try{

    const result =
      await db
        .from("movies")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );


    if(result.error){

      throw result.error;

    }


    allMovies =
      result.data || [];


    render(allMovies);


  }catch(error){

    console.error(error);


    box.innerHTML=`

      <div class="status error">

        <strong>
          Database error
        </strong>

        ${safe(error.message)}

      </div>

    `;

  }

}


/* SEARCH */

document
.getElementById("search")
.addEventListener(
  "input",
  function(){

    const q =
      this.value
      .trim()
      .toLowerCase();


    if(!q){

      render(allMovies);

      return;

    }


    const filtered =
      allMovies.filter(movie=>{

        return [
          movie.title,
          movie.description,
          movie.genre,
          movie.year
        ]
        .join(" ")
        .toLowerCase()
        .includes(q);

      });


    render(filtered);

  }
);


/* SEARCH BUTTON */

function focusSearch(){

  const input =
    document.getElementById("search");

  input.focus();

  window.scrollTo({
    top:250,
    behavior:"smooth"
  });

}


/* INTERNET ARCHIVE */

async function loadArchive(){

  const box =
    document.getElementById("archive");


  try{

    const url =
      "https://archive.org/advancedsearch.php"+
      "?q=mediatype%3Amovies%20AND%20collection%3Aopensource_movies"+
      "&fl%5B%5D=identifier"+
      "&fl%5B%5D=title"+
      "&fl%5B%5D=year"+
      "&rows=6"+
      "&output=json";


    const response =
      await fetch(url);


    const data =
      await response.json();


    const items =
      data.response?.docs || [];


    if(!items.length){

      box.innerHTML=`
        <div class="status">
          No archive movies found.
        </div>
      `;

      return;

    }


    box.innerHTML =
      items.map(item=>{

        const id =
          item.identifier || "";

        const title =
          item.title ||
          id ||
          "Archive Movie";


        return `

          <article
            class="card"
            onclick='openMovie({
              source:"archive",
              identifier:${JSON.stringify(id)},
              title:${JSON.stringify(title)},
              year:${JSON.stringify(item.year || "")}
            })'
          >

            <div class="poster">

              <img
                src="https://archive.org/services/img/${encodeURIComponent(id)}"
                alt="${safe(title)}"
              >

              <div class="play">
                ▶
              </div>

            </div>

            <div class="info">

              <div class="title">
                ${safe(title)}
              </div>

              <div class="meta">
                ${safe(item.year || "Internet Archive")}
              </div>

            </div>

          </article>

        `;

      }).join("");


  }catch(error){

    box.innerHTML=`

      <div class="status">
        <strong>
          Internet Archive unavailable
        </strong>

        Your NEX BOX movies are still available above.
      </div>

    `;

  }

}


/* START */

loadMovies();

loadArchive();

</script>

</body>
</html>
