<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="mobile-web-app-capable" content="yes">

  <title>NEX BOX</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      margin: 0;
      background: #050505;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .nex-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(5,5,5,.96);
      border-bottom: 1px solid #1d1d1d;
      padding: 14px 16px;
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .header-btn {
      color: white;
      text-decoration: none;
      background: #171717;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
    }

    .hero {
      padding: 30px 18px 20px;
      background:
        linear-gradient(180deg,#151515,#050505);
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .hero p {
      color: #999;
      margin: 0;
      font-size: 14px;
    }

    .search {
      margin: 15px 16px;
    }

    .search input {
      width: 100%;
      box-sizing: border-box;
      background: #151515;
      color: white;
      border: 1px solid #292929;
      border-radius: 10px;
      padding: 13px;
      outline: none;
    }

    .section {
      padding: 10px 16px 100px;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 19px;
    }

    .status {
      text-align: center;
      color: #999;
      padding: 50px 15px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 12px;
    }

    .movie-card {
      background: #111;
      border-radius: 11px;
      overflow: hidden;
      cursor: pointer;
    }

    .movie-card img {
      display: block;
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #202020;
    }

    .movie-info {
      padding: 9px;
    }

    .movie-title {
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      color: #888;
      font-size: 10px;
      margin-top: 5px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 68px;
      background: rgba(8,8,8,.98);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 9999;
    }

    .bottom-nav a {
      color: #888;
      text-decoration: none;
      text-align: center;
      font-size: 10px;
    }

    .bottom-nav a.active {
      color: white;
    }

    .bottom-nav span {
      display: block;
      font-size: 20px;
      margin-bottom: 3px;
    }

    @media (min-width:700px) {
      .movie-grid {
        grid-template-columns: repeat(5,1fr);
      }

      .section {
        max-width: 1100px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

<header class="nex-header">

  <div class="header-row">

    <div class="logo">
      NEX BOX
    </div>

    <div class="header-actions">

      <a
        class="header-btn"
        href="./library.html">
        My List
      </a>

    </div>

  </div>

</header>


<section class="hero">

  <h1>Watch Movies</h1>

  <p>
    Your movies. Your library. Your NEX BOX.
  </p>

</section>


<div class="search">

  <input
    id="searchInput"
    type="search"
    placeholder="Search movies..."
    autocomplete="off">

</div>


<section class="section">

  <div class="section-title">

    <h2>Movies</h2>

    <span
      id="movieCount"
      style="color:#777;font-size:11px;">
      Loading...
    </span>

  </div>


  <div
    id="movieStatus"
    class="status">
    Loading movies...
  </div>


  <div
    id="movieGrid"
    class="movie-grid">
  </div>

</section>


<nav class="bottom-nav">

  <a
    href="./index.html"
    class="active">
    <span>⌂</span>
    Home
  </a>

  <a href="#movies">
    <span>🎬</span>
    Movies
  </a>

  <a href="./library.html">
    <span>♡</span>
    My List
  </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allMovies = [];


/* --------------------------------
   LOAD MOVIES
-------------------------------- */

async function loadMovies() {

  const status =
    document.getElementById(
      "movieStatus"
    );

  const count =
    document.getElementById(
      "movieCount"
    );

  try {

    const { data, error } =
      await db
        .from("movies")
        .select("*")
        .order(
          "created_at",
          { ascending: false }
        );


    if (error) {

      console.error(
        "Supabase movie error:",
        error
      );

      status.innerHTML =
        "Movies could not be loaded.";

      count.textContent =
        "Error";

      return;
    }


    allMovies =
      Array.isArray(data)
        ? data
        : [];


    count.textContent =
      allMovies.length +
      (
        allMovies.length === 1
          ? " movie"
          : " movies"
      );


    renderMovies(allMovies);


  } catch (error) {

    console.error(error);

    status.innerHTML =
      "Unable to connect to NEX BOX.";

    count.textContent =
      "Error";
  }

}


/* --------------------------------
   RENDER
-------------------------------- */

function renderMovies(movies) {

  const grid =
    document.getElementById(
      "movieGrid"
    );

  const status =
    document.getElementById(
      "movieStatus"
    );


  grid.innerHTML = "";


  if (!movies.length) {

    status.style.display =
      "block";

    status.innerHTML =
      "No movies available yet.";

    return;
  }


  status.style.display =
    "none";


  movies.forEach(movie => {

    const card =
      document.createElement(
        "article"
      );

    card.className =
      "movie-card";


    const poster =
      movie.poster_url ||
      "https://via.placeholder.com/400x600/111111/ffffff?text=NEX+BOX";


    const title =
      movie.title ||
      "Untitled Movie";


    const meta =
      [
        movie.year,
        movie.genre
      ]
      .filter(Boolean)
      .join(" • ");


    card.innerHTML = `

      <img
        src="${escapeHTML(poster)}"
        alt="${escapeHTML(title)}"
        onerror="
          this.src='https://via.placeholder.com/400x600/111111/ffffff?text=NEX+BOX'
        "
      >

      <div class="movie-info">

        <div class="movie-title">
          ${escapeHTML(title)}
        </div>

        <div class="movie-meta">
          ${escapeHTML(meta)}
        </div>

      </div>
    `;


    card.addEventListener(
      "click",
      function() {

        location.href =
          "./watch.html?movie=" +
          encodeURIComponent(
            movie.id
          );

      }
    );


    grid.appendChild(card);

  });

}


/* --------------------------------
   SEARCH
-------------------------------- */

document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    function() {

      const query =
        this.value
          .trim()
          .toLowerCase();


      if (!query) {

        renderMovies(
          allMovies
        );

        return;
      }


      const filtered =
        allMovies.filter(movie => {

          const title =
            String(
              movie.title || ""
            ).toLowerCase();

          const genre =
            String(
              movie.genre || ""
            ).toLowerCase();

          const description =
            String(
              movie.description || ""
            ).toLowerCase();

          return (
            title.includes(query) ||
            genre.includes(query) ||
            description.includes(query)
          );

        });


      renderMovies(
        filtered
      );

    }
  );


/* --------------------------------
   ESCAPE
-------------------------------- */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* --------------------------------
   START
-------------------------------- */

loadMovies();


/* SERVICE WORKER */

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    function() {

      navigator.serviceWorker
        .register("./sw.js")
        .catch(function(error) {

          console.log(
            "Service worker:",
            error
          );

        });

    }
  );

}

</script>

</body>
  </html>
