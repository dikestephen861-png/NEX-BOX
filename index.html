<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#08090c"
  >

  <meta
    name="description"
    content="NEX BOX movie library"
  >

  <title>NEX BOX</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

  <div class="logo">
    NEX<span>BOX</span>
  </div>

  <div class="top-actions">

    <button
      class="icon-btn"
      onclick="focusSearch()"
      aria-label="Search"
    >
      🔎
    </button>

    <a
      href="./admin.html"
      class="icon-btn"
      aria-label="Admin"
      style="text-decoration:none;"
    >
      ⚙️
    </a>

  </div>

</header>


<main>

  <!-- HERO -->

  <section class="hero">

    <div class="hero-box">

      <div class="hero-content">

        <div class="hero-label">
          NEX BOX
        </div>

        <h1 class="hero-title">
          Watch Movies
        </h1>

        <p class="hero-description">
          Discover movies available in your NEX BOX library.
          Select a movie to watch.
        </p>

        <div class="hero-buttons">

          <button
            class="hero-btn watch-btn"
            onclick="goMovies()"
          >
            ▶ Browse Movies
          </button>

          <button
            class="hero-btn info-btn"
            onclick="focusSearch()"
          >
            🔎 Search
          </button>

        </div>

      </div>

    </div>

  </section>


  <!-- SEARCH -->

  <section class="search-box">

    <input
      id="searchBox"
      class="search-input"
      type="search"
      placeholder="Search movies..."
      autocomplete="off"
    >

  </section>


  <!-- CATEGORIES -->

  <section class="section">

    <div class="categories">

      <button
        class="category active"
        onclick="filterCategory('All', this)"
      >
        All
      </button>

      <button
        class="category"
        onclick="filterCategory('Action', this)"
      >
        Action
      </button>

      <button
        class="category"
        onclick="filterCategory('Comedy', this)"
      >
        Comedy
      </button>

      <button
        class="category"
        onclick="filterCategory('Drama', this)"
      >
        Drama
      </button>

      <button
        class="category"
        onclick="filterCategory('Animation', this)"
      >
        Animation
      </button>

      <button
        class="category"
        onclick="filterCategory('Adventure', this)"
      >
        Adventure
      </button>

    </div>

  </section>


  <!-- MOVIES -->

  <section
    class="section"
    id="movies"
  >

    <div class="section-header">

      <h2 class="section-title">
        Latest Movies
      </h2>

      <span
        class="section-more"
        id="movieCount"
      >
        Movies
      </span>

    </div>


    <div
      id="movieList"
      class="movies"
    >

      <div class="loading">
        Loading movies...
      </div>

    </div>

  </section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <button
    class="nav-item active"
    onclick="goHome()"
  >

    <span class="nav-icon">
      🏠
    </span>

    <span>
      Home
    </span>

  </button>


  <button
    class="nav-item"
    onclick="goMovies()"
  >

    <span class="nav-icon">
      🎬
    </span>

    <span>
      Movies
    </span>

  </button>


  <button
    class="nav-item"
    onclick="focusSearch()"
  >

    <span class="nav-icon">
      🔎
    </span>

    <span>
      Search
    </span>

  </button>


  <a
    href="./admin.html"
    class="nav-item"
    style="text-decoration:none;"
  >

    <span class="nav-icon">
      ⚙️
    </span>

    <span>
      Admin
    </span>

  </a>

</nav>


<script>

const SUPABASE_URL =
  "https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let movies = [];

let activeCategory = "All";


/* =========================
   LOAD MOVIES
========================= */

async function loadMovies() {

  const movieList =
    document.getElementById("movieList");

  movieList.innerHTML =
    '<div class="loading">Loading movies...</div>';

  try {

    const { data, error } =
      await db
        .from("movies")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(
        "Supabase error:",
        error
      );

      movieList.innerHTML =
        '<div class="loading">Unable to load movies.</div>';

      return;
    }


    movies = data || [];

    console.log(
      "NEX BOX Movies found:",
      movies.length
    );


    displayMovies(movies);

  } catch (error) {

    console.error(
      "Movie loading error:",
      error
    );

    movieList.innerHTML =
      '<div class="loading">Something went wrong.</div>';
  }

}


/* =========================
   DISPLAY MOVIES
========================= */

function displayMovies(list) {

  const movieList =
    document.getElementById("movieList");

  const movieCount =
    document.getElementById("movieCount");


  movieList.innerHTML = "";


  if (movieCount) {

    movieCount.textContent =
      list.length +
      (list.length === 1
        ? " Movie"
        : " Movies");

  }


  if (!list.length) {

    movieList.innerHTML =
      '<div class="loading">No movies found.</div>';

    return;
  }


  list.forEach(movie => {

    const card =
      document.createElement("div");

    card.className =
      "movie-card";


    const poster =
      movie.poster_url ||
      "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba";


    const title =
      movie.title ||
      "Untitled Movie";


    const year =
      movie.year ||
      "";


    const genre =
      movie.genre ||
      "";


    card.innerHTML = `

      <img
        class="movie-poster"
        src="${escapeHTML(poster)}"
        alt="${escapeHTML(title)}"
        loading="lazy"
      >

      <div class="movie-info">

        <div class="movie-title">
          ${escapeHTML(title)}
        </div>

        <div class="movie-meta">
          ${escapeHTML(String(year))}
          ${
            year && genre
              ? " • "
              : ""
          }
          ${escapeHTML(genre)}
        </div>

      </div>

    `;


    card.addEventListener(
      "click",
      () => {

        if (!movie.id) {

          alert(
            "This movie does not have a valid ID."
          );

          return;
        }


        window.location.href =
          "./watch.html?movie=" +
          encodeURIComponent(movie.id);

      }
    );


    movieList.appendChild(card);

  });

}


/* =========================
   CATEGORY FILTER
========================= */

function filterCategory(
  category,
  button
) {

  activeCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(btn => {

      btn.classList.remove(
        "active"
      );

    });


  if (button) {

    button.classList.add(
      "active"
    );

  }


  applyFilters();

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("searchBox")
  .addEventListener(
    "input",
    function () {

      applyFilters();

    }
  );


function applyFilters() {

  const searchInput =
    document.getElementById(
      "searchBox"
    );


  const search =
    (
      searchInput.value ||
      ""
    )
      .toLowerCase()
      .trim();


  let filtered =
    [...movies];


  /* CATEGORY */

  if (
    activeCategory !==
    "All"
  ) {

    filtered =
      filtered.filter(
        movie =>
          String(
            movie.genre || ""
          )
            .toLowerCase()
            .includes(
              activeCategory
                .toLowerCase()
            )
      );

  }


  /* SEARCH */

  if (search) {

    filtered =
      filtered.filter(
        movie => {

          const title =
            String(
              movie.title || ""
            )
              .toLowerCase();


          const genre =
            String(
              movie.genre || ""
            )
              .toLowerCase();


          const description =
            String(
              movie.description || ""
            )
              .toLowerCase();


          return (
            title.includes(search) ||
            genre.includes(search) ||
            description.includes(search)
          );

        }
      );

  }


  displayMovies(
    filtered
  );

}


/* =========================
   SEARCH BUTTON
========================= */

function focusSearch() {

  const searchBox =
    document.getElementById(
      "searchBox"
    );


  searchBox.focus();


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================
   HOME
========================= */

function goHome() {

  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}


/* =========================
   MOVIES
========================= */

function goMovies() {

  const moviesSection =
    document.getElementById(
      "movies"
    );


  moviesSection.scrollIntoView({

    behavior: "smooth"

  });

}


/* =========================
   SECURITY
========================= */

function escapeHTML(value) {

  return String(
    value || ""
  )

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================
   START APP
========================= */

loadMovies();

</script>

</body>
      </html>
