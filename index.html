<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090c">

<link rel="manifest" href="./manifest.json">

<title>NEX BOX</title>

<link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">

  <div class="logo">
    NEX<span>BOX</span>
  </div>

  <div class="top-actions">

    <button
      class="icon-btn"
      onclick="focusSearch()"
      aria-label="Search">
      🔍
    </button>

    <a
      href="./library.html"
      class="icon-btn"
      style="text-decoration:none;">
      ❤️
    </a>

    <a
      href="./admin.html"
      class="icon-btn"
      style="text-decoration:none;">
      ⚙️
    </a>

  </div>

</header>


<main>

<!-- HERO -->

<section class="hero">

  <div class="hero-box">

    <div class="hero-content">

      <div class="hero-label">
        NEX BOX ORIGINAL
      </div>

      <h1 class="hero-title">
        Watch. Save. Enjoy.
      </h1>

      <p class="hero-description">
        Discover movies and watch your collection
        anywhere from NEX BOX.
      </p>

      <div class="hero-buttons">

        <button
          class="hero-btn watch-btn"
          onclick="goMovies()">
          ▶ Browse Movies
        </button>

        <button
          class="hero-btn info-btn"
          onclick="openLibrary()">
          ❤️ My List
        </button>

      </div>

    </div>

  </div>

</section>


<!-- SEARCH -->

<section class="search-box">

  <input
    id="searchBox"
    class="search-input"
    type="search"
    placeholder="Search movies..."
    autocomplete="off">

</section>


<!-- CATEGORIES -->

<section class="section">

  <div class="categories"
       style="
       display:flex;
       gap:8px;
       overflow-x:auto;
       padding-bottom:4px;
       scrollbar-width:none;
       ">

    <button
      class="category"
      onclick="setCategory('All',this)"
      style="
      border:0;
      border-radius:20px;
      padding:9px 15px;
      background:#e50914;
      color:#fff;
      white-space:nowrap;
      font-weight:700;">
      All
    </button>

    <button
      class="category"
      onclick="setCategory('Action',this)"
      style="
      border:0;
      border-radius:20px;
      padding:9px 15px;
      background:#171a21;
      color:#aaa;
      white-space:nowrap;
      font-weight:700;">
      Action
    </button>

    <button
      class="category"
      onclick="setCategory('Comedy',this)"
      style="
      border:0;
      border-radius:20px;
      padding:9px 15px;
      background:#171a21;
      color:#aaa;
      white-space:nowrap;
      font-weight:700;">
      Comedy
    </button>

    <button
      class="category"
      onclick="setCategory('Drama',this)"
      style="
      border:0;
      border-radius:20px;
      padding:9px 15px;
      background:#171a21;
      color:#aaa;
      white-space:nowrap;
      font-weight:700;">
      Drama
    </button>

    <button
      class="category"
      onclick="setCategory('Animation',this)"
      style="
      border:0;
      border-radius:20px;
      padding:9px 15px;
      background:#171a21;
      color:#aaa;
      white-space:nowrap;
      font-weight:700;">
      Animation
    </button>

    <button
      class="category"
      onclick="setCategory('Adventure',this)"
      style="
      border:0;
      border-radius:20px;
      padding:9px 15px;
      background:#171a21;
      color:#aaa;
      white-space:nowrap;
      font-weight:700;">
      Adventure
    </button>

  </div>

</section>


<!-- MOVIES -->

<section
  class="section"
  id="movies">

  <div class="section-header">

    <h2 class="section-title">
      Movies
    </h2>

    <span
      id="movieCount"
      class="section-more">
      Loading...
    </span>

  </div>

  <div
    id="movieList"
    class="movie-grid">

    <div class="loading">
      Loading movies...
    </div>

  </div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a
    class="nav-item active"
    href="./index.html">

    <span class="nav-icon">
      🏠
    </span>

    <span>
      Home
    </span>

  </a>


  <button
    class="nav-item"
    onclick="goMovies()">

    <span class="nav-icon">
      🎬
    </span>

    <span>
      Movies
    </span>

  </button>


  <a
    class="nav-item"
    href="./library.html">

    <span class="nav-icon">
      ❤️
    </span>

    <span>
      Library
    </span>

  </a>


  <button
    class="nav-item"
    onclick="focusSearch()">

    <span class="nav-icon">
      🔍
    </span>

    <span>
      Search
    </span>

  </button>


  <a
    class="nav-item"
    href="./admin.html">

    <span class="nav-icon">
      ⚙️
    </span>

    <span>
      Admin
    </span>

  </a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let allMovies = [];

let selectedCategory = "All";


const movieList =
document.getElementById("movieList");

const searchBox =
document.getElementById("searchBox");


async function loadMovies(){

  movieList.innerHTML = `
    <div class="loading">
      Loading movies...
    </div>
  `;

  const result =
    await db
      .from("movies")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(result.error){

    console.error(
      "NEX BOX Supabase error:",
      result.error
    );

    movieList.innerHTML = `
      <div class="loading">
        Movies could not be loaded.
        <br><br>
        <small>
        Please check your connection.
        </small>
      </div>
    `;

    return;
  }

  allMovies =
    result.data || [];

  displayMovies(allMovies);

}


function displayMovies(movies){

  movieList.innerHTML = "";

  document.getElementById(
    "movieCount"
  ).textContent =
    movies.length + " movie" +
    (movies.length === 1 ? "" : "s");


  if(!movies.length){

    movieList.innerHTML = `
      <div class="loading">
        No movies found.
      </div>
    `;

    return;
  }


  movies.forEach(movie => {

    const card =
      document.createElement("article");

    card.className =
      "movie-card";


    const poster =
      movie.poster_url ||
      "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba";


    card.innerHTML = `

      <img
        class="movie-poster"
        src="${escapeHTML(poster)}"
        alt="${escapeHTML(movie.title || "Movie")}"
        loading="lazy">

      <div class="movie-info">

        <div class="movie-title">
          ${escapeHTML(
            movie.title || "Untitled Movie"
          )}
        </div>

        <div class="movie-meta">

          ${escapeHTML(
            String(movie.year || "")
          )}

          ${
            movie.year && movie.genre
            ? " • "
            : ""
          }

          ${escapeHTML(
            movie.genre || ""
          )}

        </div>

      </div>
    `;


    card.addEventListener(
      "click",
      function(){

        window.location.href =
          "./watch.html?movie=" +
          encodeURIComponent(movie.id);

      }
    );


    movieList.appendChild(card);

  });

}


function filterMovies(){

  const search =
    searchBox.value
      .trim()
      .toLowerCase();


  let filtered =
    allMovies.filter(movie => {

      const matchesSearch =
        !search ||
        String(movie.title || "")
          .toLowerCase()
          .includes(search) ||

        String(movie.genre || "")
          .toLowerCase()
          .includes(search) ||

        String(movie.description || "")
          .toLowerCase()
          .includes(search);


      const matchesCategory =
        selectedCategory === "All" ||

        String(movie.genre || "")
          .toLowerCase()
          .includes(
            selectedCategory.toLowerCase()
          );


      return (
        matchesSearch &&
        matchesCategory
      );

    });


  displayMovies(filtered);

}


function setCategory(
  category,
  button
){

  selectedCategory =
    category;


  document
    .querySelectorAll(".category")
    .forEach(btn => {

      btn.style.background =
        "#171a21";

      btn.style.color =
        "#aaa";

    });


  button.style.background =
    "#e50914";

  button.style.color =
    "#fff";


  filterMovies();

}


function focusSearch(){

  const box =
    document.getElementById(
      "searchBox"
    );

  box.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  setTimeout(
    () => box.focus(),
    300
  );

}


function goMovies(){

  document
    .getElementById("movies")
    .scrollIntoView({
      behavior:"smooth"
    });

}


function openLibrary(){

  window.location.href =
    "./library.html";

}


function escapeHTML(value){

  return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


searchBox.addEventListener(
  "input",
  filterMovies
);


loadMovies();


/* SERVICE WORKER */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    function(){

      navigator.serviceWorker
        .register("./sw.js")
        .catch(
          error =>
            console.log(
              "Service worker:",
              error
            )
        );

    }
  );

}

</script>

</body>
  </html>
