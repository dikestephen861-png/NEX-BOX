<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050505">

<title>NEX BOX</title>

<link rel="manifest" href="./manifest.json">
<link rel="stylesheet" href="./style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header class="topbar">
  <div class="logo">
    NEX <span>BOX</span>
  </div>

  <button id="searchBtn">🔍</button>
</header>

<div id="searchPanel">
  <input
    id="searchInput"
    type="search"
    placeholder="Search movies..."
  >
</div>

<main>

<section class="hero">
  <p>WELCOME TO</p>
  <h1>NEX <span>BOX</span></h1>
  <div id="status">Connecting...</div>
</section>


<section class="section">

  <div class="section-head">
    <h2>NEX BOX MOVIES</h2>
    <button id="refreshBtn">Refresh</button>
  </div>

  <div id="movieGrid" class="movie-grid">
    <div class="loading">
      Loading movies...
    </div>
  </div>

</section>


<section class="section">

  <div class="section-head">
    <div>
      <h2>INTERNET ARCHIVE</h2>
      <small>Open-source movies</small>
    </div>

    <button id="archiveBtn">More</button>
  </div>

  <div id="archiveGrid" class="movie-grid">
    <div class="loading">
      Loading Archive movies...
    </div>
  </div>

</section>

</main>


<nav class="bottom-nav">

  <button class="active">
    <b>⌂</b>
    <small>Home</small>
  </button>

  <button onclick="location.href='./movies.html'">
    <b>🎬</b>
    <small>Movies</small>
  </button>

  <button onclick="location.href='./library.html'">
    <b>♡</b>
    <small>My List</small>
  </button>

</nav>


<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let movies = [];
let archiveMovies = [];


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value) {

  if (value == null) return "";

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   OPEN MOVIE
========================= */

function openMovie(movie) {

  const data =
    encodeURIComponent(
      JSON.stringify(movie)
    );

  location.href =
    "./watch.html?movie=" + data;
}


/* =========================
   MOVIE CARD
========================= */

function card(movie, source) {

  const poster =
    movie.poster_url ||
    "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=500&q=80";

  return `

  <article
    class="movie-card"
    data-movie='${escapeHTML(
      JSON.stringify(movie)
    )}'
  >

    <div class="poster">

      <img
        src="${escapeHTML(poster)}"
        alt="${escapeHTML(movie.title)}"
        loading="lazy"
      >

      <div class="play">▶</div>

      <span>
        ${source}
      </span>

    </div>

    <h3>
      ${escapeHTML(
        movie.title || "Untitled"
      )}
    </h3>

    <p>
      ${escapeHTML(
        movie.year || ""
      )}
      ${movie.genre ? " • " + escapeHTML(movie.genre) : ""}
    </p>

  </article>

  `;
}


/* =========================
   LOAD SUPABASE MOVIES
========================= */

async function loadMovies() {

  const grid =
    document.getElementById(
      "movieGrid"
    );

  const status =
    document.getElementById(
      "status"
    );

  grid.innerHTML = `
    <div class="loading">
      Loading NEX BOX movies...
    </div>
  `;

  try {

    const result =
      await db
        .from("movies")
        .select("*")
        .order(
          "created_at",
          {
            ascending:false
          }
        );

    console.log(
      "SUPABASE RESULT:",
      result
    );

    if (result.error) {
      throw result.error;
    }

    movies =
      result.data || [];


    if (!movies.length) {

      grid.innerHTML = `
        <div class="loading">
          No NEX BOX movies yet.
        </div>
      `;

      status.textContent =
        "Connected — 0 movies";

      return;
    }


    grid.innerHTML =
      movies
        .map(
          m => card(m,"NEX")
        )
        .join("");


    status.textContent =
      "Connected — " +
      movies.length +
      " movies";


    attachCards();

  }

  catch(error) {

    console.error(
      "MOVIE ERROR:",
      error
    );

    grid.innerHTML = `

      <div class="error">

        <strong>
          Movie database error
        </strong>

        <p>
          ${escapeHTML(
            error.message
          )}
        </p>

      </div>
    `;

    status.textContent =
      "Database connection error";

  }

}


/* =========================
   INTERNET ARCHIVE
========================= */

async function loadArchive() {

  const grid =
    document.getElementById(
      "archiveGrid"
    );

  try {

    const query =
      "mediatype:movies AND collection:opensource_movies";

    const url =
      "https://archive.org/advancedsearch.php" +
      "?q=" +
      encodeURIComponent(query) +
      "&fl[]=identifier" +
      "&fl[]=title" +
      "&fl[]=description" +
      "&fl[]=year" +
      "&rows=8" +
      "&output=json";

    const response =
      await fetch(url);

    if (!response.ok) {
      throw new Error(
        "Archive request failed"
      );
    }

    const data =
      await response.json();

    const docs =
      data.response.docs || [];


    archiveMovies =
      docs.map(item => ({

        id:
          "archive-" +
          item.identifier,

        archive_id:
          item.identifier,

        title:
          item.title ||
          "Archive Movie",

        description:
          item.description || "",

        year:
          item.year || "",

        genre:
          "Open Source",

        source:
          "ARCHIVE",

        poster_url:
          "https://archive.org/services/img/" +
          encodeURIComponent(
            item.identifier
          )

      }));


    if (!archiveMovies.length) {

      grid.innerHTML = `
        <div class="loading">
          No Archive movies found.
        </div>
      `;

      return;
    }


    grid.innerHTML =
      archiveMovies
        .map(
          m => card(m,"ARCHIVE")
        )
        .join("");


    attachCards();

  }

  catch(error) {

    console.error(
      "ARCHIVE ERROR:",
      error
    );

    grid.innerHTML = `
      <div class="error">
        Internet Archive unavailable.
      </div>
    `;

  }

}


/* =========================
   CARD CLICK
========================= */

function attachCards() {

  document
    .querySelectorAll(
      ".movie-card"
    )
    .forEach(card => {

      card.onclick = () => {

        try {

          const movie =
            JSON.parse(
              card.dataset.movie
            );

          openMovie(movie);

        }
        catch(error) {

          console.error(error);

        }

      };

    });

}


/* =========================
   SEARCH
========================= */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function() {

      const term =
        this.value
          .toLowerCase()
          .trim();

      if (!term) {

        document
          .getElementById(
            "movieGrid"
          )
          .innerHTML =
            movies
              .map(
                m => card(m,"NEX")
              )
              .join("");

        attachCards();

        return;
      }


      const results =
        [
          ...movies,
          ...archiveMovies
        ]
        .filter(movie => {

          const text =
            [
              movie.title,
              movie.description,
              movie.genre,
              movie.year
            ]
            .join(" ")
            .toLowerCase();

          return text.includes(term);

        });


      const grid =
        document.getElementById(
          "movieGrid"
        );


      if (!results.length) {

        grid.innerHTML = `
          <div class="loading">
            No movie found.
          </div>
        `;

        return;

      }


      grid.innerHTML =
        results
          .map(
            m =>
              card(
                m,
                m.source ===
                "ARCHIVE"
                  ? "ARCHIVE"
                  : "NEX"
              )
          )
          .join("");


      attachCards();

    }
  );


/* =========================
   SEARCH BUTTON
========================= */

document
  .getElementById(
    "searchBtn"
  )
  .onclick = () => {

    const panel =
      document.getElementById(
        "searchPanel"
      );

    panel.classList.toggle(
      "open"
    );

    if (
      panel.classList.contains(
        "open"
      )
    ) {

      document
        .getElementById(
          "searchInput"
        )
        .focus();

    }

  };


/* =========================
   REFRESH
========================= */

document
  .getElementById(
    "refreshBtn"
  )
  .onclick =
    loadMovies;


document
  .getElementById(
    "archiveBtn"
  )
  .onclick =
    loadArchive;


/* =========================
   START
========================= */

loadMovies();

loadArchive();


/* =========================
   SERVICE WORKER
========================= */

if (
  "serviceWorker"
  in navigator
) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "./sw.js?v=11"
        )
        .catch(
          error =>
            console.log(
              "SW:",
              error
            )
        );

    }
  );

}

</script>

</body>
    </html>
