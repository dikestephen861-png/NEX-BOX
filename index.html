<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#090909">
<title>NEX BOX</title>

<link rel="manifest" href="manifest.json">

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  background:#080808;
  color:#fff;
  font-family:Arial,sans-serif;
}

body{
  padding-bottom:75px;
}

.header{
  height:64px;
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 14px;
  background:#090909;
  border-bottom:1px solid #222;
}

.logo{
  font-size:21px;
  font-weight:900;
  white-space:nowrap;
}

.logo b{
  color:#e50914;
}

.search{
  flex:1;
  min-width:0;
  height:40px;
  border-radius:22px;
  border:1px solid #333;
  outline:none;
  background:#181818;
  color:white;
  padding:0 14px;
}

.search::placeholder{
  color:#777;
}

.admin{
  border:0;
  background:#e50914;
  color:white;
  border-radius:18px;
  padding:9px 11px;
  font-size:11px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.hero{
  min-height:205px;
  border-radius:16px;
  padding:25px 20px;
  display:flex;
  align-items:flex-end;
  margin-bottom:22px;
  background:
    linear-gradient(to top,#000,transparent),
    linear-gradient(135deg,#252525,#101010);
}

.hero small{
  color:#e50914;
  font-weight:bold;
}

.hero h1{
  margin:8px 0;
  font-size:30px;
}

.hero p{
  margin:0;
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

.title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.title-row h2{
  margin:0;
  font-size:20px;
}

.refresh{
  background:#181818;
  color:#fff;
  border:1px solid #333;
  border-radius:18px;
  padding:7px 12px;
}

.movies{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

@media(min-width:600px){
  .movies{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(min-width:900px){
  .movies{
    grid-template-columns:repeat(5,1fr);
  }
}

.card{
  background:#151515;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #252525;
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  background:#202020;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-fallback{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  padding:10px;
  font-size:12px;
}

.info{
  padding:9px;
}

.name{
  font-size:14px;
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  color:#777;
  font-size:11px;
  margin-top:5px;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:50px 20px;
  color:#888;
}

.error{
  grid-column:1/-1;
  text-align:center;
  padding:40px 15px;
  color:#ff7777;
}

.nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  z-index:50;
  background:#0d0d0d;
  border-top:1px solid #252525;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav button{
  border:0;
  background:none;
  color:#777;
  font-size:11px;
}

.nav button:first-child{
  color:#e50914;
}

.icon{
  display:block;
  font-size:21px;
  margin-bottom:3px;
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    NEX<b>BOX</b>
  </div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Search movies..."
  >

  <button
    class="admin"
    onclick="location.href='admin.html'"
  >
    ADMIN
  </button>

</header>

<main class="container">

  <section class="hero">

    <div>

      <small>NEX BOX</small>

      <h1>Watch Your Movies</h1>

      <p>
        Your movie library. Watch your available
        movies directly from NEX BOX.
      </p>

    </div>

  </section>

  <div class="title-row">

    <h2>Movies</h2>

    <button
      class="refresh"
      onclick="loadMovies()"
    >
      Refresh
    </button>

  </div>

  <section
    id="movies"
    class="movies"
  >

    <div class="loading">
      Loading movies...
    </div>

  </section>

</main>

<nav class="nav">

  <button onclick="scrollTop()">
    <span class="icon">⌂</span>
    Home
  </button>

  <button onclick="document.getElementById('movies').scrollIntoView({behavior:'smooth'})">
    <span class="icon">▦</span>
    Movies
  </button>

  <button onclick="alert('My List will be added next.')">
    <span class="icon">♡</span>
    My List
  </button>

  <button onclick="alert('Downloads will be added to the player.')">
    <span class="icon">↓</span>
    Downloads
  </button>

</nav>

<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

let movies = [];

async function loadMovies(){

  const box =
    document.getElementById("movies");

  box.innerHTML =
    '<div class="loading">Loading movies...</div>';

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/movies?select=*&order=created_at.desc",
      {
        method:"GET",

        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer " + SUPABASE_KEY,
          "Content-Type":"application/json"
        }
      }
    );

    const text =
      await response.text();

    console.log("SUPABASE:",response.status,text);

    if(!response.ok){
      throw new Error(
        "Database returned " +
        response.status
      );
    }

    movies =
      JSON.parse(text);

    showMovies(movies);

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="error">
        <h3>Movies could not load</h3>
        <p>${error.message}</p>
        <button
          onclick="loadMovies()"
          style="
            background:#e50914;
            color:white;
            border:0;
            border-radius:20px;
            padding:10px 18px;
          "
        >
          Try Again
        </button>
      </div>
    `;

  }

}

function showMovies(list){

  const box =
    document.getElementById("movies");

  if(!list.length){

    box.innerHTML =
      '<div class="loading">No movies found.</div>';

    return;
  }

  box.innerHTML = "";

  list.forEach(movie => {

    const card =
      document.createElement("div");

    card.className =
      "card";

    card.onclick = function(){

      localStorage.setItem(
        "nexbox_selected_movie",
        JSON.stringify(movie)
      );

      location.href =
        "movie.html?id=" +
        encodeURIComponent(movie.id);

    };

    let posterHTML;

    if(movie.poster_url){

      posterHTML = `
        <img
          src="${escapeHTML(movie.poster_url)}"
          alt="${escapeHTML(movie.title || "Movie")}"
          onerror="
            this.style.display='none';
            this.parentElement.innerHTML +=
            '<div class=poster-fallback>Poster unavailable</div>';
          "
        >
      `;

    }else{

      posterHTML =
        '<div class="poster-fallback">No Poster</div>';

    }

    card.innerHTML = `

      <div class="poster">
        ${posterHTML}
      </div>

      <div class="info">

        <div class="name">
          ${escapeHTML(movie.title || "Untitled Movie")}
        </div>

        <div class="meta">
          ${escapeHTML(movie.genre || "Movie")}
          ${movie.year ? " • " + movie.year : ""}
        </div>

      </div>

    `;

    box.appendChild(card);

  });

}

document
.getElementById("search")
.addEventListener("input",function(){

  const query =
    this.value.toLowerCase().trim();

  if(!query){

    showMovies(movies);
    return;

  }

  const filtered =
    movies.filter(movie => {

      const title =
        String(movie.title || "")
        .toLowerCase();

      const genre =
        String(movie.genre || "")
        .toLowerCase();

      const description =
        String(movie.description || "")
        .toLowerCase();

      return (
        title.includes(query) ||
        genre.includes(query) ||
        description.includes(query)
      );

    });

  showMovies(filtered);

});

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function scrollTop(){

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}

loadMovies();

</script>

</body>
</html>
