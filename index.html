<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>NEX BOX</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:#050505;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding-bottom:75px;
}

/* HEADER */

header{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  background:#070707;
  border-bottom:1px solid #1d1d1d;
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#e50914;
}

.header-actions{
  display:flex;
  align-items:center;
  gap:8px;
}

.admin-button{
  appearance:none;
  -webkit-appearance:none;
  border:1px solid #333;
  background:#151515;
  color:#fff;
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
  text-decoration:none;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:34px;
  position:relative;
  z-index:200;
  touch-action:manipulation;
}

.admin-button:active{
  background:#e50914;
  transform:scale(.97);
}

/* HERO */

.hero{
  padding:22px 16px 18px;
}

.hero h1{
  font-size:27px;
  line-height:1.1;
  margin-bottom:7px;
}

.hero p{
  color:#8d8d8d;
  font-size:13px;
  line-height:1.5;
}

/* SECTION */

.section{
  padding:0 16px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0 14px;
}

.section-title h2{
  font-size:18px;
}

.section-title a{
  color:#aaa;
  font-size:12px;
  text-decoration:none;
}

/* MOVIE GRID */

.movie-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.movie-card{
  background:#111;
  border:1px solid #1f1f1f;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  transition:.15s;
}

.movie-card:active{
  transform:scale(.97);
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  background:#181818;
  object-fit:cover;
  display:block;
}

.movie-info{
  padding:10px;
}

.movie-title{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.movie-meta{
  color:#777;
  font-size:10px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* LOADING */

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:45px 10px;
  color:#777;
  font-size:13px;
}

/* EMPTY */

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:45px 15px;
  color:#777;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:66px;
  background:rgba(8,8,8,.97);
  border-top:1px solid #222;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:500;
  padding-bottom:env(safe-area-inset-bottom);
}

.nav-item{
  border:0;
  background:none;
  color:#777;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
  text-decoration:none;
  cursor:pointer;
}

.nav-icon{
  font-size:19px;
  line-height:1;
}

.nav-item.active{
  color:#fff;
}

.nav-item.active .nav-icon{
  color:#e50914;
}

/* RESPONSIVE */

@media(min-width:600px){
  .movie-grid{
    grid-template-columns:repeat(4,minmax(0,1fr));
  }

  .hero,
  .section{
    max-width:1000px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header>

  <div class="logo">
    NEX <span>BOX</span>
  </div>

  <div class="header-actions">

    <!-- FIXED ADMIN BUTTON -->
    <button
      class="admin-button"
      type="button"
      onclick="openAdmin()">
      ADMIN
    </button>

  </div>

</header>


<section class="hero">

  <h1>Watch Movies</h1>

  <p>
    Discover movies available in your NEX BOX library.
  </p>

</section>


<section class="section">

  <div class="section-title">
    <h2>Latest Movies</h2>

    <a href="movies.html?v=32">
      See all
    </a>
  </div>

  <div
    id="movieGrid"
    class="movie-grid">

    <div class="loading">
      Loading movies...
    </div>

  </div>

</section>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

  <a
    class="nav-item active"
    href="index.html?v=32">

    <span class="nav-icon">⌂</span>
    <span>Home</span>

  </a>


  <a
    class="nav-item"
    href="movies.html?v=32">

    <span class="nav-icon">▦</span>
    <span>Movies</span>

  </a>


  <a
    class="nav-item"
    href="library.html?v=32">

    <span class="nav-icon">♡</span>
    <span>My List</span>

  </a>

</nav>


<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_KEY =

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================================
   ADMIN BUTTON
================================ */

function openAdmin(){

  window.location.assign(
    "admin.html?v=32"
  );

}

        error
      );

          <small>${escapeHtml(error.message)}</small
