<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEX BOX</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 25px;
      font-size: 30px;
      font-weight: bold;
    }

    .welcome {
      margin-top: 100px;
      padding: 20px;
    }

    h1 {
      font-size: 45px;
    }

    p {
      color: #aaa;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <header>NEX BOX</header>

  <div class="welcome">
    <h1>Welcome to NEX BOX</h1>
    <p>Your entertainment starts here.</p>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(() => console.log("NEX BOX Service Worker registered"))
        .catch(error => console.error("SW registration failed:", error));
    }
  </script>

</body>
</html>
