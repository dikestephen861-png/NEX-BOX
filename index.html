<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#080808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="NEX BOX">

<title>NEX BOX</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  background:#080808;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100%;
}

body{
  padding-bottom:75px;
}

button{
  font-family:inherit;
}

.header{
  height:62px;
  background:#080808;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #1c1c1c;
  position:sticky;
  top:0;
  z-index:20;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:1px;
}

.logo span{
  color:#e50914;
}

.header-buttons{
  display:flex;
  gap:8px;
}

.icon-button{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#181818;
  color:#fff;
  font-size:20px;
}

.search-area{
  display:none;
  padding:10px 14px;
  background:#0b0b0b;
}

.search-area.show{
  display:block;
}

.search-input{
  width:100%;
  height:44px;
  border:1px solid #292929;
  border-radius:8px;
  outline:none;
  background:#151515;
  color:#fff;
  padding:0 13px;
  font-size:14px;
}

.hero{
  padding:22px 16px 12px;
}

.hero h1{
  font-size:28px;
  font-weight:900;
  margin-bottom:7px;
}

.hero p{
  color:#8d8d8d;
  font-size:13px;
  line-height:1.5;
}

.section{
  padding:14px;
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:13px;
}

.section-title{
  font-size:18px;
  font-weight:800;
}

.movie-count{
  color:#777;
  font-size:12px;
}

.movie-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px 10px;
}

.movie-card{
  background:#111;
  border:1px solid #1d1d1d;
  border-radius:10px;
  overflow:hidden;
  cursor:pointer;
}

.movie-card:active{
  transform:scale(.97);
}

.poster{
  width:100%;
  aspect-ratio:2/3;
  background:#171717;
  position:relative;
  overflow:hidden;
}

.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.poster-fallback{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  color:#555;
}

.play{
  position:absolute;
  bottom:8px;
  left:8px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#e50914;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:13px;
}

.movie-info{
  padding:9px;
}

.movie-title{
  font-size:14px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.movie-meta{
  color:#777;
  font-size:11px;
  margin-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.loading,
.empty,
.error{
  grid-column:1/-1;
  min-height:200px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  gap:10px;
  color:#777;
  padding:20px;
}

.spinner{
  width:32px;
  height:32px;
  border:3px solid #292929;
  border-top-color:#e50914;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.retry{
  border:0;
  background:#e50914;
  color:white;
  border-radius:7px;
  padding:10px 18px;
  font-weight:bold;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:68px;
  background:#0d0d0d;
  border-top:1px solid #202020;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav-button{
  background:none;
  border:0;
  color:#777;
  min-width:70px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  font-size:10px;
}

.nav-button.active{
  color:white;
}

.nav-icon{
  font-size:21px;
}

.nav-button.active .nav-icon{
  color:#e50914;
}

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);
  background:#222;
  color:white;
  padding:11px 16px;
  border-radius:8px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(min-width:600px){

  .movie-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .hero,
  .section{
    max-width:1000px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="logo">
    NEX <span>BOX</span>
  </div>

  <div class="header-buttons">
    <button
      class="icon-button"
      onclick="toggleSearch()"
      aria-label="Search"
    >
      🔍
    </button>
  </div>

</header>

<div class="search-area" id="searchArea">

  <input
    id="searchInput"
    class="search-input"
    type="search"
    placeholder="Search movies..."
    oninput="searchMovies()"
  >

</div>

<main>

<section class="hero">

  <h1>Watch Movies</h1>

  <p>
    Discover and watch movies in your NEX BOX library.
  </p>

</section>

<section class="section">

  <div class="section-header">

    <div class="section-title" id="sectionTitle">
      Latest Movies
    </div>

    <div class="movie-count" id="movieCount">
      Loading...
    </div>

  </div>

  <div class="movie-grid" id="movieGrid">

    <div class="loading">

      <div class="spinner"></div>

      <div>
        Connecting to NEX BOX...
      </div>

    </div>

  </div>

</section>

</main>

<nav class="bottom-nav">

  <button
    class="nav-button active"
    onclick="goHome()"
  >
    <span class="nav-icon">⌂</span>
    <span>Home</span>
  </button>

  <button
    class="nav-button"
    onclick="goMovies()"
  >
    <span class="nav-icon">▣</span>
    <span>Movies</span>
  </button>

  <button
    class="nav-button"
    onclick="showMyList()"
  >
    <span class="nav-icon">♡</span>
    <span>My List</span>
  </button>

</nav>

<div
  class="toast"
  id="toast"
></div>

<script>

/* =====================================================
   NEX BOX SUPABASE CONNECTION
   ===================================================== */

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphY3hsbWN3edertcaizdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1ODc5MTMsImV4cCI6MjEwNTE2MzkxM30.eie-QJrohLznkWvb6b1lFj9uyNr2Bw4gIUWlwr8VVHc";

let movies = [];

let savedMovies =
JSON.parse(
  localStorage.getItem("nexbox_saved") || "[]"
);


/* =====================================================
   LOAD MOVIES
   ===================================================== */

async function loadMovies(){

  const grid =
    document.getElementById("movieGrid");

  const count =
    document.getElementById("movieCount");

  grid.innerHTML = `
    <div class="loading">
      <div class="spinner"></div>
      <div>Loading movies...</div>
    </div>
  `;

  try{

    const url =
      SUPABASE_URL +
      "/rest/v1/movies?select=*&order=created_at.desc";

    console.log("NEX BOX requesting:",url);

    const response =
      await fetch(
        url,
        {
          method:"GET",

          headers:{
            "apikey":SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Content-Type":
              "application/json"
          }
        }
      );

    console.log(
      "Supabase status:",
      response.status
    );

    const text =
      await response.text();

    console.log(
      "Supabase response:",
      text
    );

    if(!response.ok){

      throw new Error(
        "Supabase returned HTTP " +
        response.status +
        ": " +
        text
      );

    }

    try{

      movies =
        JSON.parse(text);

    }catch(parseError){

      throw new Error(
        "Supabase returned invalid JSON: " +
        text
      );

    }

    if(!Array.isArray(movies)){

      throw new Error(
        "Movie data is not an array."
      );

    }

    console.log(
      "NEX BOX movies found:",
      movies.length
    );

    if(movies.length === 0){

      count.textContent =
        "0 movies";

      grid.innerHTML = `
        <div class="empty">

          <div style="font-size:45px">
            🎬
          </div>

          <strong>
            No movies yet
          </strong>

          <small>
            Add a movie from NEX BOX Admin.
          </small>

        </div>
      `;

      return;
    }

    count.textContent =
      movies.length +
      (
        movies.length === 1
        ? " movie"
        : " movies"
      );

    renderMovies(movies);

  }catch(error){

    console.error(
      "NEX BOX ERROR:",
      error
    );

    count.textContent =
      "Connection error";

    grid.innerHTML = `
      <div class="error">

        <div style="font-size:40px">
          ⚠️
        </div>

        <strong>
          Could not load movies
        </strong>

        <small>
          ${escapeHtml(error.message)}
        </small>

        <button
          class="retry"
          onclick="loadMovies()"
        >
          Try Again
        </button>

      </div>
    `;

  }

}


/* =====================================================
   DISPLAY MOVIES
   ===================================================== */

function renderMovies(list){

  const grid =
    document.getElementById("movieGrid");

  if(!list.length){

    grid.innerHTML = `
      <div class="empty">

        <div style="font-size:40px">
          🔎
        </div>

        <strong>
          No movies found
        </strong>

      </div>
    `;

    return;
  }

  grid.innerHTML =
    list.map(movie => {

      const title =
        movie.title ||
        "Untitled Movie";

      const poster =
        movie.poster_url ||
        "";

      const year =
        movie.year ||
        "";

      const genre =
        movie.genre ||
        "Movie";

      const id =
        movie.id;

      return `

        <article
          class="movie-card"
          onclick="openMovie('${escapeAttribute(id)}')"
        >

          <div class="poster">

            ${
              poster
              ?
              `
              <img
                src="${escapeAttribute(poster)}"
                alt="${escapeAttribute(title)}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                  this.nextElementSibling.style.display='flex';
                "
              >
              `
              :
              ""
            }

            <div
              class="poster-fallback"
              style="${
                poster
                ? "display:none"
                : "display:flex"
              }"
            >
              🎬
            </div>

            <div class="play">
              ▶
            </div>

          </div>

          <div class="movie-info">

            <div class="movie-title">
              ${escapeHtml(title)}
            </div>

            <div class="movie-meta">

              ${
                year
                ? escapeHtml(year) + " • "
                : ""
              }

              ${escapeHtml(genre)}

            </div>

          </div>

        </article>

      `;

    }).join("");

}


/* =====================================================
   OPEN MOVIE
   ===================================================== */

function openMovie(id){

  const movie =
    movies.find(
      item =>
        String(item.id) === String(id)
    );

  if(!movie){

    showToast(
      "Movie could not be found"
    );

    return;
  }

  localStorage.setItem(
    "nexbox_selected_movie",
    JSON.stringify(movie)
  );

  window.location.href =
    "watch.html?id=" +
    encodeURIComponent(movie.id);

}


/* =====================================================
   SEARCH
   ===================================================== */

function toggleSearch(){

  const area =
    document.getElementById("searchArea");

  const input =
    document.getElementById("searchInput");

  area.classList.toggle("show");

  if(area.classList.contains("show")){

    setTimeout(
      () => input.focus(),
      100
    );

  }

}


function searchMovies(){

  const query =
    document
      .getElementById("searchInput")
      .value
      .trim()
      .toLowerCase();

  if(!query){

    renderMovies(movies);

    document.getElementById(
      "sectionTitle"
    ).textContent =
      "Latest Movies";

    return;
  }

  const results =
    movies.filter(movie => {

      const title =
        String(
          movie.title || ""
        ).toLowerCase();

      const genre =
        String(
          movie.genre || ""
        ).toLowerCase();

      const description =
        String(
          movie.description || ""
        ).toLowerCase();

      return (
        title.includes(query) ||
        genre.includes(query) ||
        description.includes(query)
      );

    });

  document.getElementById(
    "sectionTitle"
  ).textContent =
    "Search Results";

  renderMovies(results);

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function goHome(){

  document.getElementById(
    "sectionTitle"
  ).textContent =
    "Latest Movies";

  renderMovies(movies);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function goMovies(){

  window.scrollTo({
    top:170,
    behavior:"smooth"
  });

}


function showMyList(){

  const saved =
    movies.filter(
      movie =>
        savedMovies.includes(
          movie.id
        )
    );

  document.getElementById(
    "sectionTitle"
  ).textContent =
    "My List";

  if(!saved.length){

    document.getElementById(
      "movieGrid"
    ).innerHTML = `
      <div class="empty">

        <div style="font-size:45px">
          ♡
        </div>

        <strong>
          Your My List is empty
        </strong>

        <small>
          Your saved movies will appear here.
        </small>

      </div>
    `;

    return;
  }

  renderMovies(saved);

  window.scrollTo({
    top:150,
    behavior:"smooth"
  });

}


/* =====================================================
   TOAST
   ===================================================== */

function showToast(message){

  const toast =
    document.getElementById("toast");

  toast.textContent =
    message;

  toast.classList.add("show");

  setTimeout(
    () =>
      toast.classList.remove("show"),
    2200
  );

}


/* =====================================================
   SECURITY / HTML HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");

}


/* =====================================================
   START NEX BOX
   ===================================================== */

loadMovies();

</script>

</body>
  </html>
