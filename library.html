<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">

  <title>NEX BOX — My List</title>

  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">

  <style>
    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    .library-page {
      padding: 18px;
      padding-bottom: 100px;
    }

    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .library-header h1 {
      margin: 0;
      font-size: 24px;
    }

    .count {
      font-size: 13px;
      color: #aaa;
    }

    #empty {
      text-align: center;
      padding: 70px 20px;
      color: #aaa;
    }

    #empty h2 {
      color: white;
      margin-bottom: 10px;
    }

    .movie-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .movie-card {
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    .movie-card img {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #222;
    }

    .movie-info {
      padding: 10px;
    }

    .movie-title {
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .movie-meta {
      color: #999;
      font-size: 11px;
      margin-top: 5px;
    }

    .remove-btn {
      width: 100%;
      border: 0;
      margin-top: 8px;
      padding: 8px;
      border-radius: 7px;
      background: #222;
      color: #ff4d4d;
      font-size: 12px;
    }

    .watch-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      margin-top: 8px;
      padding: 9px;
      border-radius: 7px;
      background: white;
      color: black;
      font-size: 12px;
      font-weight: bold;
    }

    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 68px;
      background: rgba(10,10,10,.97);
      border-top: 1px solid #222;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 1000;
    }

    .bottom-nav a {
      color: #888;
      text-decoration: none;
      font-size: 11px;
      text-align: center;
    }

    .bottom-nav a.active {
      color: white;
    }

    .bottom-nav span {
      display: block;
      font-size: 21px;
      margin-bottom: 3px;
    }

    @media (min-width: 700px) {
      .movie-grid {
        grid-template-columns: repeat(5, 1fr);
      }

      .library-page {
        max-width: 1100px;
        margin: auto;
      }
    }
  </style>
</head>

<body>

  <main class="library-page">

    <div class="library-header">
      <div>
        <h1>My List</h1>
        <div class="count" id="movieCount">0 saved movies</div>
      </div>
    </div>

    <div id="empty">
      <h2>Your list is empty</h2>
      <p>Movies you add to My List will appear here.</p>
      <a href="./index.html" class="watch-btn">Browse Movies</a>
    </div>

    <div id="movieGrid" class="movie-grid"></div>

  </main>

  <nav class="bottom-nav">
    <a href="./index.html">
      <span>⌂</span>
      Home
    </a>

    <a href="./index.html#movies">
      <span>🎬</span>
      Movies
    </a>

    <a href="./library.html" class="active">
      <span>♡</span>
      My List
    </a>
  </nav>

  <script>
    const STORAGE_KEY = "nexbox_my_list";

    function getMovies() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) {
          return [];
        }

        const movies = JSON.parse(saved);

        if (!Array.isArray(movies)) {
          return [];
        }

        return movies;
      } catch (error) {
        console.error("NEX BOX My List error:", error);
        return [];
      }
    }

    function renderMovies() {

      const movies = getMovies();

      const grid = document.getElementById("movieGrid");
      const empty = document.getElementById("empty");
      const count = document.getElementById("movieCount");

      count.textContent =
        movies.length === 1
          ? "1 saved movie"
          : movies.length + " saved movies";

      grid.innerHTML = "";

      if (movies.length === 0) {
        empty.style.display = "block";
        return;
      }

      empty.style.display = "none";

      movies.forEach(movie => {

        const card = document.createElement("div");
        card.className = "movie-card";

        const poster =
          movie.poster_url ||
          "https://via.placeholder.com/400x600/111111/ffffff?text=NEX+BOX";

        const title =
          movie.title || "Untitled Movie";

        const year =
          movie.year || "";

        const genre =
          movie.genre || "";

        card.innerHTML = `
          <img
            src="${poster}"
            alt="${escapeHTML(title)}"
            onerror="this.src='https://via.placeholder.com/400x600/111111/ffffff?text=NEX+BOX'"
          >

          <div class="movie-info">

            <div class="movie-title">
              ${escapeHTML(title)}
            </div>

            <div class="movie-meta">
              ${escapeHTML(String(year))}
              ${year && genre ? " • " : ""}
              ${escapeHTML(genre)}
            </div>

            <a
              class="watch-btn"
              href="./watch.html?movie=${encodeURIComponent(movie.id)}"
            >
              ▶ Watch
            </a>

            <button
              class="remove-btn"
              onclick="removeMovie('${escapeJS(movie.id)}')"
            >
              Remove from My List
            </button>

          </div>
        `;

        grid.appendChild(card);
      });
    }

    function removeMovie(id) {

      let movies = getMovies();

      movies = movies.filter(movie =>
        String(movie.id) !== String(id)
      );

      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(movies)
      );

      renderMovies();
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeJS(value) {
      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");
    }

    renderMovies();

    window.addEventListener("pageshow", renderMovies);

    window.addEventListener("storage", renderMovies);
  </script>

</body>
</html>
