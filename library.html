<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color"
content="#050505">

<title>NEX BOX — My List</title>

<link rel="stylesheet"
href="./style.css">

<style>

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
}

.library-page {
  padding: 20px;
  padding-bottom: 100px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.header h1 {
  margin: 0;
  font-size: 25px;
}

.count {
  color: #999;
  font-size: 12px;
  margin-top: 5px;
}

.movie-grid {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 14px;
}

.card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
}

.card img {
  width: 100%;
  aspect-ratio: 2/3;
  object-fit: cover;
  display: block;
  background: #222;
}

.info {
  padding: 10px;
}

.title {
  font-weight: bold;
  font-size: 14px;
}

.meta {
  color: #888;
  font-size: 11px;
  margin-top: 5px;
}

.watch {
  display: block;
  text-align: center;
  text-decoration: none;
  background: white;
  color: black;
  padding: 9px;
  border-radius: 7px;
  margin-top: 9px;
  font-size: 12px;
  font-weight: bold;
}

.remove {
  width: 100%;
  border: 0;
  background: #222;
  color: #ff5555;
  padding: 8px;
  border-radius: 7px;
  margin-top: 7px;
}

.empty {
  text-align: center;
  color: #888;
  padding: 80px 20px;
}

.empty h2 {
  color: white;
}

.bottom-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  height: 68px;
  background: rgba(10,10,10,.98);
  border-top: 1px solid #222;
  display: flex;
  justify-content: space-around;
  align-items: center;
  z-index: 9999;
}

.bottom-nav a {
  color: #888;
  text-decoration: none;
  text-align: center;
  font-size: 11px;
}

.bottom-nav a.active {
  color: white;
}

.bottom-nav span {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}

@media (min-width:700px) {

.movie-grid {
  grid-template-columns:
    repeat(5,1fr);
}

.library-page {
  max-width:1100px;
  margin:auto;
}

}

</style>

</head>

<body>

<main class="library-page">

<div class="header">

<div>

<h1>My List</h1>

<div
id="count"
class="count">
Loading...
</div>

</div>

</div>

<div
id="empty"
class="empty"
style="display:none;">

<h2>Your list is empty</h2>

<p>
Movies you save will appear here.
</p>

<a
href="./index.html"
class="watch">
Browse Movies
</a>

</div>

<div
id="movieGrid"
class="movie-grid">
</div>

</main>


<nav class="bottom-nav">

<a href="./index.html">
<span>⌂</span>
Home
</a>

<a href="./index.html#movies">
<span>🎬</span>
Movies
</a>

<a
href="./library.html"
class="active">
<span>♡</span>
My List
</a>

</nav>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://jacxlmcwwedertcaizdj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_LZQ6oY0ReQ5uerLsHOtYIQ_llOyeB94";

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* DEVICE ID */

function getDeviceId() {

let id =
localStorage.getItem(
"nexbox_device_id"
);

if (!id) {

id =
crypto.randomUUID
? crypto.randomUUID()
: Date.now().toString(36) +
Math.random().toString(36).slice(2);

localStorage.setItem(
"nexbox_device_id",
id
);

}

return id;

}


/* LOAD LIST */

async function loadList() {

const grid =
document.getElementById(
"movieGrid"
);

const empty =
document.getElementById(
"empty"
);

const count =
document.getElementById(
"count"
);

grid.innerHTML = "";

count.textContent =
"Loading...";


const deviceId =
getDeviceId();


const { data, error } =
await db
.from("nexbox_my_list")
.select("*")
.eq("device_id", deviceId)
.order(
"created_at",
{ ascending:false }
);


if (error) {

console.error(
"My List error:",
error
);

count.textContent =
"Could not load My List";

empty.style.display =
"block";

empty.querySelector("h2").textContent =
"My List could not be loaded";

return;

}


const movies =
(data || []).map(row =>
row.movie_data
);


count.textContent =
movies.length === 1
? "1 saved movie"
: movies.length +
" saved movies";


if (!movies.length) {

empty.style.display =
"block";

return;

}


empty.style.display =
"none";


movies.forEach(movie => {

const card =
document.createElement("div");

card.className =
"card";


const poster =
movie.poster_url ||
"https://via.placeholder.com/400x600/111111/ffffff?text=NEX+BOX";


card.innerHTML = `

<img
src="${escapeHTML(poster)}"
alt="${escapeHTML(movie.title || "Movie")}"
onerror="
this.src='https://via.placeholder.com/400x600/111111/ffffff?text=NEX+BOX'
">

<div class="info">

<div class="title">
${escapeHTML(movie.title || "Untitled Movie")}
</div>

<div class="meta">
${escapeHTML(String(movie.year || ""))}
${movie.year && movie.genre ? " • " : ""}
${escapeHTML(movie.genre || "")}
</div>

<a
class="watch"
href="./watch.html?movie=${encodeURIComponent(movie.id)}">
▶ Watch
</a>

<button
class="remove"
onclick="removeMovie('${escapeJS(movie.id)}')">
Remove from My List
</button>

</div>

`;

grid.appendChild(card);

});

}


/* REMOVE */

async function removeMovie(movieId) {

const deviceId =
getDeviceId();


const { error } =
await db
.from("nexbox_my_list")
.delete()
.eq("device_id", deviceId)
.eq("movie_id", String(movieId));


if (error) {

console.error(error);

alert(
"Could not remove movie."
);

return;

}

loadList();

}


/* SAFETY */

function escapeHTML(value) {

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

function escapeJS(value) {

return String(value)
.replace(/\\/g,"\\\\")
.replace(/'/g,"\\'");

}


loadList();

</script>

</body>

  </html>
