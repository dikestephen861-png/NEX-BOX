<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>NEX BOX Player</title>

  <meta name="theme-color" content="#080808">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 20px;
      border-bottom: 1px solid #222;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .logo span {
      color: #e50914;
    }

    .container {
      padding: 20px;
      max-width: 1000px;
      margin: auto;
    }

    video {
      width: 100%;
      max-height: 600px;
      background: #111;
      border-radius: 8px;
    }

    h1 {
      margin-top: 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: white;
      text-decoration: none;
      background: #222;
      padding: 10px 18px;
      border-radius: 6px;
    }

    .description {
      color: #aaa;
      line-height: 1.6;
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    NEX<span>BOX</span>
  </div>
</header>

<div class="container">

  <a class="back" href="./index.html">
    ← Back to NEX BOX
  </a>

  <video controls playsinline>
    <source
      src="https://storage.googleapis.com/coverr-main/mp4/Mt_Baker.mp4"
      type="video/mp4"
    >

    Your browser does not support video playback.
  </video>

  <h1>NEX BOX Demo Movie</h1>

  <p class="description">
    This is a demonstration video used to test the NEX BOX
    video player. Replace this source later with a video
    you own or have permission to stream.
  </p>

</div>

</body>
  </html>
